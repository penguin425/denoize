name: DPDFNet promotion evidence

on:
  workflow_dispatch:
    inputs:
      stress_seconds:
        description: Sustained DPDFNet DAW measurement duration
        required: true
        default: "60"
  push:
    branches:
      - poc/dpdfnet-comparison
    paths:
      - ".github/workflows/dpdfnet-promotion.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "examples/*dpdfnet*"
      - "models/**"
      - "plugins/denoize-clap/**"
      - "schemas/denoize-dpdfnet-*"
      - "scripts/*dpdfnet*"
      - "scripts/reaper-clap-parameter-smoke.lua"
      - "src/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/dpdfnet-promotion.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "examples/*dpdfnet*"
      - "models/**"
      - "plugins/denoize-clap/**"
      - "schemas/denoize-dpdfnet-*"
      - "scripts/*dpdfnet*"
      - "scripts/reaper-clap-parameter-smoke.lua"
      - "src/**"

permissions:
  contents: read

env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  DPDFNET_MODEL_SHA256: 7f0575a5cec0ba4ffd8f8bd657e06d007e4ccdd955d76faab922b9d3291dc14b
  DPDFNET_MODEL_URL: https://huggingface.co/Ceva-IP/DPDFNet/resolve/dd6818d00f50c836fed43a6243ebe49116de5964/onnx/dpdfnet2_48khz_hr.onnx

concurrency:
  group: dpdfnet-promotion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: ${{ matrix.target }} portable evidence
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/libdenoize_clap.so
            archive: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/libdenoize_clap.dylib
            archive: tar.gz
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/denoize_clap.dll
            archive: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Check out source
        # actions/checkout v6.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Select minimum supported Rust
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0
          rustup target add "${{ matrix.target }}"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libasound2-dev python3-jsonschema python3-venv

      - name: Record evidence environment
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)
              cpu_model=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)
              os_version=$(uname -srmo)
              # RUNNER_TEMP is below /home on GitHub's Linux images. The
              # runner grants service accounts access to that ancestor with
              # an extended ACL, which the production atomic-output guard
              # correctly rejects for model provenance. Use a private child
              # of the sticky system temp directory instead.
              model_root=$(mktemp -d /tmp/denoize-models.XXXXXX)
              ;;
            macOS)
              cpu_model=$(sysctl -n machdep.cpu.brand_string 2>/dev/null || sysctl -n hw.model)
              os_version=$(sw_vers -productName)-$(sw_vers -productVersion)-$(sw_vers -buildVersion)
              model_root="$RUNNER_TEMP/denoize-models"
              ;;
            Windows)
              cpu_model=$(powershell.exe -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1 -ExpandProperty Name).Trim()' | tr -d '\r')
              os_version=$(powershell.exe -NoProfile -Command '[System.Environment]::OSVersion.VersionString' | tr -d '\r')
              model_root="$RUNNER_TEMP/denoize-models"
              ;;
            *) exit 1 ;;
          esac
          {
            echo "DENOIZE_EVIDENCE_SOURCE_COMMIT=$GITHUB_SHA"
            echo "DENOIZE_EVIDENCE_TARGET=${{ matrix.target }}"
            echo "DENOIZE_EVIDENCE_OS_VERSION=$os_version"
            echo "DENOIZE_EVIDENCE_CPU_MODEL=$cpu_model"
            echo "DENOIZE_EVIDENCE_HARDWARE_TIER=portable-ci"
            echo "DENOIZE_EVIDENCE_RUNNER_LABEL=${{ matrix.os }}"
            echo "DENOIZE_MODEL_DIR=$model_root"
            echo "DENOIZE_EVIDENCE_DIR=$RUNNER_TEMP/dpdfnet-evidence"
          } >> "$GITHUB_ENV"

      - name: Install pinned DPDFNet model
        shell: bash
        run: |
          model_dir="$DENOIZE_MODEL_DIR/dpdfnet2-48khz-hr"
          mkdir -p "$model_dir" "$DENOIZE_EVIDENCE_DIR"
          model="$model_dir/dpdfnet2_48khz_hr.onnx"
          curl --fail --location --retry 5 --output "$model" "$DPDFNET_MODEL_URL"
          if command -v sha256sum >/dev/null 2>&1; then
            observed=$(sha256sum < "$model" | awk '{print $1}')
          else
            observed=$(shasum -a 256 < "$model" | awk '{print $1}')
          fi
          test "$observed" = "$DPDFNET_MODEL_SHA256"
          echo "DPDFNET_MODEL=$model" >> "$GITHUB_ENV"

      - name: Install pinned official ONNX reference runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/dpdfnet-reference-python"
          "$RUNNER_TEMP/dpdfnet-reference-python/bin/python" -m pip install \
            --disable-pip-version-check \
            'numpy==2.5.2' \
            'onnxruntime==1.29.0'

      - name: Validate compensated production path against ONNX Runtime
        if: runner.os == 'Linux'
        shell: bash
        env:
          RAYON_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          reference_dir=$(mktemp -d /tmp/denoize-dpdfnet-reference.XXXXXX)
          reference_input="$reference_dir/input.wav"
          reference_actual="$reference_dir/production-aligned.wav"
          cargo run --locked --release --target "${{ matrix.target }}" \
            --features dpdfnet,gtcrn --example dpdfnet_production_reference -- \
            --model "$DPDFNET_MODEL" \
            --input "$reference_input" \
            --actual "$reference_actual"
          "$RUNNER_TEMP/dpdfnet-reference-python/bin/python" \
            scripts/validate-dpdfnet-poc.py \
            --model "$DPDFNET_MODEL" \
            --input "$reference_input" \
            --actual "$reference_actual" \
            --alignment-samples 1920 \
            | tee "$DENOIZE_EVIDENCE_DIR/production-reference-validation.txt"
          install -m 644 "$reference_input" \
            "$DENOIZE_EVIDENCE_DIR/production-reference-input.wav"
          install -m 644 "$reference_actual" \
            "$DENOIZE_EVIDENCE_DIR/production-aligned.wav"

      - name: Measure production DPDFNet DAW path
        shell: bash
        env:
          DENOIZE_MACOS_SCHEDULING_EVIDENCE: "1"
          RAYON_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          seconds="${{ inputs.stress_seconds || '60' }}"
          cargo run --locked --release --target "${{ matrix.target }}" \
            --features dpdfnet,gtcrn --example dpdfnet_gtcrn_stress -- \
            --model dpdfnet-daw --model-path "$DPDFNET_MODEL" \
            --seconds "$seconds" --parallel 1 \
            --realtime-paced \
            --json "$DENOIZE_EVIDENCE_DIR/stress.json" \
            2>&1 | tee "$DENOIZE_EVIDENCE_DIR/stress-run.log"
          if [[ "$RUNNER_OS" == macOS ]]; then
            expected_cycles=$((seconds * 100))
            grep -Fx \
              "DENOIZE_MACOS_TIME_CONSTRAINT period_ns=10000000 computation_ns=8000000 constraint_ns=10000000" \
              "$DENOIZE_EVIDENCE_DIR/stress-run.log"
            grep -Fx \
              "DENOIZE_MACOS_AUDIO_WORK_INTERVAL started_cycles=$expected_cycles finished_cycles=$expected_cycles start_failures=0 finish_failures=0" \
              "$DENOIZE_EVIDENCE_DIR/stress-run.log"
          fi

      - name: Exercise stereo CLAP worker at actual 144, 480, and 1024-frame callbacks
        id: worker_gate
        shell: bash
        env:
          DENOIZE_NEURAL_WORKER_EVIDENCE: ${{ runner.temp }}/dpdfnet-evidence/worker.json
          DENOIZE_NEURAL_WORKER_SECONDS: ${{ inputs.stress_seconds || '60' }}
          RAYON_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          cargo test --locked --release --target "${{ matrix.target }}" \
            -p denoize --lib --no-default-features --features dpdfnet,gtcrn \
            backend::dpdfnet::tests::pinned_dpdfnet2_runtime_reuse_matches_fresh_inference \
            -- --ignored --exact --nocapture
          cargo test --locked --release --target "${{ matrix.target }}" \
            -p denoize-clap --lib --features experimental-dpdfnet-hq \
            neural::tests::pinned_dpdfnet2_stereo_matches_independent_mono \
            -- --ignored --exact --nocapture
          cargo test --locked --release --target "${{ matrix.target }}" \
            -p denoize-clap --lib --features experimental-dpdfnet-hq \
            neural::tests::pinned_dpdfnet2_release_worker_meets_sustained_deadlines \
            -- --ignored --exact --nocapture

      - name: Generate closed platform evidence
        shell: bash
        run: |
          python3 scripts/generate-dpdfnet-platform-evidence.py \
            --stress "$DENOIZE_EVIDENCE_DIR/stress.json" \
            --worker "$DENOIZE_EVIDENCE_DIR/worker.json" \
            --output "$DENOIZE_EVIDENCE_DIR/platform.json"

      - name: Profile a rejected stereo worker without changing its gate result
        if: failure() && steps.worker_gate.outcome == 'failure'
        continue-on-error: true
        shell: bash
        env:
          DENOIZE_NEURAL_WORKER_PROFILE: ${{ runner.temp }}/dpdfnet-evidence/worker-profile
          DENOIZE_NEURAL_PROFILE_CALLBACK_FRAMES: "144,480,1024"
          DENOIZE_NEURAL_WORKER_SECONDS: ${{ inputs.stress_seconds || '60' }}
          RAYON_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          # Diagnostic-only, real worker/feeder traces. The failed strict
          # worker.json is retained unchanged and still rejects this job.
          cargo test --locked --release --target "${{ matrix.target }}" \
            -p denoize-clap --lib --features experimental-dpdfnet-hq \
            neural::tests::pinned_dpdfnet2_release_worker_profiles_deadline_failure \
            -- --ignored --exact --nocapture

      - name: Profile rejected optimized model operations separately from its gate
        if: failure() && steps.worker_gate.outcome == 'failure'
        continue-on-error: true
        shell: bash
        env:
          DENOIZE_DPDFNET_OP_PROFILE: ${{ runner.temp }}/dpdfnet-evidence/model-op-profile.json
          RAYON_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          cargo test --locked --release --target "${{ matrix.target }}" \
            --lib --no-default-features --features dpdfnet,gtcrn \
            backend::dpdfnet::tests::pinned_dpdfnet2_op_profile_diagnostic \
            -- --ignored --exact --nocapture

      - name: Compare rejected Windows callback notifications on the same runner
        if: failure() && runner.os == 'Windows' && steps.worker_gate.outcome == 'failure'
        continue-on-error: true
        shell: bash
        env:
          DENOIZE_NEURAL_WORKER_PROFILE: ${{ runner.temp }}/dpdfnet-evidence/worker-profile-comparison
          DENOIZE_NEURAL_WORKER_SECONDS: ${{ inputs.stress_seconds || '60' }}
          RAYON_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          # ABBA diagnostic only; no result replaces the rejected strict gate.
          cargo test --locked --release --target "${{ matrix.target }}" \
            -p denoize-clap --lib --features experimental-dpdfnet-hq \
            neural::tests::pinned_dpdfnet2_release_worker_compares_callback_notifications \
            -- --ignored --exact --nocapture

      - name: Compare rejected Windows System and mimalloc diagnostics
        if: failure() && runner.os == 'Windows' && steps.worker_gate.outcome == 'failure'
        continue-on-error: true
        shell: bash
        env:
          DENOIZE_DIAGNOSTIC_SECONDS: ${{ inputs.stress_seconds || '60' }}
          RAYON_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          umask 077
          evidence="$DENOIZE_EVIDENCE_DIR/allocator-comparison"
          bin_dir=$(mktemp -d "$RUNNER_TEMP/dpdfnet-allocator-binaries.XXXXXX")
          mkdir -p "$evidence"
          manifest="$evidence/allocator-comparison-manifest.json"
          built=()

          build_test_binary() {
            local key="$1" package="$2" features="$3" test_name="$4"
            local log="$evidence/build-${key}.jsonl"
            local target="${{ matrix.target }}"
            local cargo_args=(test --locked --release --target "$target" -p "$package" --lib \
              --no-run --message-format=json)
            if [[ "$package" == denoize ]]; then
              cargo_args+=(--no-default-features)
            fi
            cargo_args+=(--features "$features")
            cargo "${cargo_args[@]}" > "$log" 2> "$evidence/build-${key}.stderr.log"
            local exe
            exe=$(jq -br --arg test "$test_name" \
              'select(.reason=="compiler-artifact" and .profile.test==true and .target.name==$test) | .executable // empty' \
              "$log" | sort -u)
            test "$(printf '%s\n' "$exe" | sed '/^$/d' | wc -l)" -eq 1
            local raw="$exe"; local unix_path win
            unix_path=$(cygpath -u "$raw")
            test -f "$unix_path"
            local copy="$bin_dir/$key.exe"
            test ! -e "$copy" && test ! -L "$copy"
            cp --no-clobber "$unix_path" "$copy"
            win=$(cygpath -w "$copy")
            built+=("$key|$package|$features|$test_name|$copy|$win")
          }

          # Resolve every compiler artifact before starting any measurement.
          build_test_binary core-system denoize 'dpdfnet,gtcrn' denoize
          build_test_binary core-mimalloc denoize 'dpdfnet,gtcrn,diagnostic-mimalloc' denoize
          build_test_binary clap-system denoize-clap experimental-dpdfnet-hq denoize_clap
          build_test_binary clap-mimalloc denoize-clap 'experimental-dpdfnet-hq,diagnostic-mimalloc' denoize_clap

          lookup_binary() {
            local wanted="$1" entry key package features test_name copy win
            for entry in "${built[@]}"; do
              IFS='|' read -r key package features test_name copy win <<< "$entry"
              if [[ "$key" == "$wanted" ]]; then printf '%s\n' "$copy"; return 0; fi
            done
            return 1
          }

          # The copied test binaries are diagnostic-only and never enter the
          # attested production artifact directory.
          manifest_parts=()
          for entry in "${built[@]}"; do
            IFS='|' read -r key package features test_name copy win <<< "$entry"
            binary_sha=$(sha256sum < "$copy" | awk '{print $1}')
            part="$evidence/manifest-${key}.json"
            jq -n --arg variant "$key" --arg package "$package" --arg features "$features" \
              --arg target "${{ matrix.target }}" --arg binary "$win" --arg binary_sha "$binary_sha" \
              --arg source "$GITHUB_SHA" --arg model "$DPDFNET_MODEL_SHA256" \
              '{variant:$variant,package:$package,features:$features,target:$target,binary:$binary,binary_sha256:$binary_sha,source_sha:$source,model_sha256:$model,diagnostic_only:true,allocator_override:false}' > "$part"
            manifest_parts+=("$part")
          done
          core_system_sha=$(sha256sum < "$(lookup_binary core-system)" | awk '{print $1}')
          core_mimalloc_sha=$(sha256sum < "$(lookup_binary core-mimalloc)" | awk '{print $1}')
          clap_system_sha=$(sha256sum < "$(lookup_binary clap-system)" | awk '{print $1}')
          clap_mimalloc_sha=$(sha256sum < "$(lookup_binary clap-mimalloc)" | awk '{print $1}')
          set -o noclobber
          jq -s --arg source "$GITHUB_SHA" --arg model "$DPDFNET_MODEL_SHA256" \
            --arg rust "$(rustc --version)" --arg cargo "$(cargo --version)" \
            --arg rustflags "${RUSTFLAGS-}" --arg encoded_rustflags "${CARGO_ENCODED_RUSTFLAGS-}" \
            --arg flags "--locked --release --lib --no-run --message-format=json; root --no-default-features; per-variant target/features below" \
            --arg order "core-system,core-mimalloc,clap-system,clap-mimalloc; measurements: core-0-system,core-1-mimalloc,core-2-mimalloc,core-3-system; worker-0-system,worker-1-mimalloc,worker-2-mimalloc,worker-3-system" \
            --arg core_system_sha "$core_system_sha" --arg core_mimalloc_sha "$core_mimalloc_sha" \
            --arg clap_system_sha "$clap_system_sha" --arg clap_mimalloc_sha "$clap_mimalloc_sha" \
            '{diagnostic_only:true,source_sha:$source,model_sha256:$model,rust_toolchain:$rust,cargo_version:$cargo,rustflags:$rustflags,encoded_rustflags:$encoded_rustflags,compiler_flags:$flags,execution_order:$order,allocator_override:false,mimalloc_wrapper_version:"0.1.52",mimalloc_sys_version:"0.1.49",legacy_mimalloc_c_version:"3.3.2 diagnostic-only; not a production candidate",formal_gate_substitute:false,rss_measured:false,whole_process_cpu_measured:false,binary_sha256:{core_system:$core_system_sha,core_mimalloc:$core_mimalloc_sha,clap_system:$clap_system_sha,clap_mimalloc:$clap_mimalloc_sha},variants:.}' \
            "${manifest_parts[@]}" > "$manifest"
          set +o noclobber

          # Run the normal CLAP ignored checks before profiling; they are not
          # replaced by the diagnostic worker measurements.
          for entry in "${built[@]}"; do
            IFS='|' read -r key package features test_name copy win <<< "$entry"
            [[ "$package" == denoize-clap ]] || continue
            DENOIZE_MODEL_DIR="$DENOIZE_MODEL_DIR" "$copy" --nocapture 2>&1 | tee "$evidence/normal-${key}.log"
            DENOIZE_MODEL_DIR="$DENOIZE_MODEL_DIR" "$copy" \
              neural::tests::pinned_dpdfnet2_stereo_matches_independent_mono \
              --ignored --exact --nocapture 2>&1 | tee "$evidence/stereo-${key}.log"
          done

          core_order=(core-system core-mimalloc core-mimalloc core-system)
          for index in 0 1 2 3; do
            key="${core_order[$index]}"
            copy=$(lookup_binary "$key")
            profile="$evidence/allocator-core-${index}-$( [[ "$key" == *mimalloc ]] && echo mimalloc || echo system ).json"
            DENOIZE_MODEL_DIR="$DENOIZE_MODEL_DIR" \
              DENOIZE_DPDFNET_OP_PROFILE="$(cygpath -w "$profile")" \
              "$copy" backend::dpdfnet::tests::pinned_dpdfnet2_op_profile_diagnostic \
              --ignored --exact --nocapture 2>&1 | tee "$evidence/core-${index}.log"
            expected_allocator=std-system
            expected_sha="$core_system_sha"
            if [[ "$key" == *mimalloc ]]; then
              expected_allocator=mimalloc
              expected_sha="$core_mimalloc_sha"
            fi
            jq -e --arg source "$GITHUB_SHA" --arg model "$DPDFNET_MODEL_SHA256" \
              --arg allocator "$expected_allocator" --arg binary_sha "$expected_sha" \
              '.source_commit==$source and .model_sha256==$model and .test_allocator==$allocator and .test_binary_sha256==$binary_sha and .actual_hops==300 and .reference_bit_exact_hops==304 and (.output_checksum_sha256|type=="string" and test("^[0-9a-f]{64}$"))' \
              "$profile"
          done
          jq -s -e 'length==4 and ([.[].output_checksum_sha256]|unique|length)==1' \
            "$evidence/allocator-core-0-system.json" "$evidence/allocator-core-1-mimalloc.json" \
            "$evidence/allocator-core-2-mimalloc.json" "$evidence/allocator-core-3-system.json"
          worker_order=(clap-system clap-mimalloc clap-mimalloc clap-system)
          for index in 0 1 2 3; do
            key="${worker_order[$index]}"
            copy=$(lookup_binary "$key")
            profile="$evidence/allocator-worker-${index}-$( [[ "$key" == *mimalloc ]] && echo mimalloc || echo system )"
            DENOIZE_MODEL_DIR="$DENOIZE_MODEL_DIR" \
              DENOIZE_NEURAL_PROFILE_CALLBACK_FRAMES="144,480,1024" \
              DENOIZE_NEURAL_WORKER_SECONDS="$DENOIZE_DIAGNOSTIC_SECONDS" \
              DENOIZE_NEURAL_WORKER_PROFILE="$(cygpath -w "$profile")" \
              "$copy" neural::tests::pinned_dpdfnet2_release_worker_profiles_deadline_failure \
              --ignored --exact --nocapture 2>&1 | tee "$evidence/worker-${index}.log"
            expected_allocator=std-system
            expected_sha="$clap_system_sha"
            if [[ "$key" == *mimalloc ]]; then
              expected_allocator=mimalloc
              expected_sha="$clap_mimalloc_sha"
            fi
            for callback_frames in 144 480 1024; do
              jq -e --arg source "$GITHUB_SHA" --arg allocator "$expected_allocator" \
                --arg binary_sha "$expected_sha" --argjson callback_frames "$callback_frames" \
                --argjson seconds "$DENOIZE_DIAGNOSTIC_SECONDS" \
                '.source_commit==$source and .test_allocator==$allocator and .test_binary_sha256==$binary_sha and .diagnostic_only==true and .callback_frames==$callback_frames and .requested_seconds==$seconds and .callback_notifications_enabled==true' \
                "$profile.$callback_frames.json"
            done
          done

      - name: Preserve rejected platform diagnostics
        if: failure()
        # actions/upload-artifact v6.
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: dpdfnet-rejected-${{ matrix.target }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dpdfnet-evidence
          if-no-files-found: warn
          retention-days: 7

      - name: Build and package experimental CLAP
        shell: bash
        run: |
          cargo build --locked --release --target "${{ matrix.target }}" \
            -p denoize-clap --features experimental-dpdfnet-hq
          cargo test --locked --release --target "${{ matrix.target }}" \
            -p denoize-clap --lib --features experimental-dpdfnet-hq \
            tests::bundle_exposes_stable_realtime_and_neural_plugin_ids -- --exact
          archive=$(bash scripts/package-dpdfnet-experimental-clap.sh \
            "${{ matrix.target }}" "$GITHUB_SHA" "$DENOIZE_EVIDENCE_DIR" \
            "${{ matrix.binary }}" "$DPDFNET_MODEL")
          echo "DPDFNET_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Export prebuilt Linux executables for the one-CPU gate
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mapfile -t worker_gates < <(
            find "target/${{ matrix.target }}/release/deps" -maxdepth 1 \
              -type f -name 'denoize_clap-*' -perm /111 -print
          )
          test "${#worker_gates[@]}" -eq 1
          install -m 755 "${worker_gates[0]}" \
            "$DENOIZE_EVIDENCE_DIR/dpdfnet-worker-gate"
          install -m 755 \
            "target/${{ matrix.target }}/release/examples/dpdfnet_gtcrn_stress" \
            "$DENOIZE_EVIDENCE_DIR/dpdfnet-stress-gate"

      - name: Exercise DPDFNet in REAPER with the OSARA parameter path
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & scripts/test-reaper-dpdfnet-clap.ps1 `
            -PluginBinary "${{ matrix.binary }}" `
            -ModelRoot "$env:DENOIZE_MODEL_DIR" `
            -OutputDirectory "$env:DENOIZE_EVIDENCE_DIR" `
            -SourceCommit "$env:GITHUB_SHA" `
            -DurationSeconds 60

      - name: Preserve rejected Windows host diagnostics
        if: failure() && runner.os == 'Windows'
        # actions/upload-artifact v6.
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: dpdfnet-rejected-host-${{ matrix.target }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dpdfnet-evidence
          if-no-files-found: warn
          retention-days: 7

      - name: Attest experimental artifact and measurements
        if: github.event_name != 'pull_request'
        id: attest
        # actions/attest v4.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/dpdfnet-evidence/*

      - name: Preserve Sigstore bundle
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" \
            "$DENOIZE_EVIDENCE_DIR/dpdfnet-${{ matrix.target }}.sigstore.json"

      - name: Record verifier GitHub CLI version
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          gh --version | tee "$RUNNER_TEMP/dpdfnet-gh-version-${{ matrix.target }}.txt"

      - name: Verify local attestation bundle subjects
        if: github.event_name != 'pull_request'
        id: verify-local-attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bundle="$DENOIZE_EVIDENCE_DIR/dpdfnet-${{ matrix.target }}.sigstore.json"
          test -f "$bundle"
          subjects=()
          shopt -s nullglob dotglob
          for subject in "$DENOIZE_EVIDENCE_DIR"/*; do
            [[ -f "$subject" ]] || continue
            [[ "$subject" == "$bundle" ]] && continue
            subjects+=("$subject")
          done
          test "${#subjects[@]}" -gt 0
          for subject in "${subjects[@]}"; do
            gh attestation verify "$subject" \
              --repo penguin425/denoize \
              --bundle "$bundle" \
              --signer-workflow penguin425/denoize/.github/workflows/dpdfnet-promotion.yml \
              --source-digest "$GITHUB_SHA"
          done

      - name: Preserve rejected local attestation diagnostics
        if: failure() && steps.verify-local-attestation.outcome == 'failure'
        # actions/upload-artifact v6.
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: dpdfnet-rejected-attestation-${{ matrix.target }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dpdfnet-evidence
            ${{ runner.temp }}/dpdfnet-gh-version-${{ matrix.target }}.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload experimental artifact and evidence
        # actions/upload-artifact v6.
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: dpdfnet-experimental-${{ matrix.target }}
          path: ${{ runner.temp }}/dpdfnet-evidence
          if-no-files-found: error
          retention-days: 30

  lowest-supported:
    name: One-CPU lowest-supported evidence
    if: github.event_name != 'pull_request'
    needs: platform
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Check out source
        # actions/checkout v6.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Download attested Linux gate executables
        # actions/download-artifact v7.
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: dpdfnet-experimental-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/portable-linux

      - name: Verify downloaded gate executables
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          portable="$RUNNER_TEMP/portable-linux"
          bundle="$portable/dpdfnet-x86_64-unknown-linux-gnu.sigstore.json"
          for executable in dpdfnet-stress-gate dpdfnet-worker-gate; do
            gh attestation verify "$portable/$executable" \
              --repo penguin425/denoize \
              --bundle "$bundle" \
              --signer-workflow penguin425/denoize/.github/workflows/dpdfnet-promotion.yml \
              --source-digest "$GITHUB_SHA"
          done

      - name: Record lowest-tier environment
        shell: bash
        run: |
          cpu_model=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)
          os_version=$(uname -srmo)
          evidence_dir="$RUNNER_TEMP/dpdfnet-lowest-supported"
          model_root=$(mktemp -d /tmp/denoize-lowest-models.XXXXXX)
          test "$(nproc)" -eq 1
          {
            echo "DENOIZE_EVIDENCE_SOURCE_COMMIT=$GITHUB_SHA"
            echo "DENOIZE_EVIDENCE_TARGET=x86_64-unknown-linux-gnu"
            echo "DENOIZE_EVIDENCE_OS_VERSION=$os_version"
            echo "DENOIZE_EVIDENCE_CPU_MODEL=$cpu_model"
            echo "DENOIZE_EVIDENCE_HARDWARE_TIER=lowest-supported"
            echo "DENOIZE_EVIDENCE_RUNNER_LABEL=ubuntu-slim"
            echo "DENOIZE_MODEL_DIR=$model_root"
            echo "DENOIZE_EVIDENCE_DIR=$evidence_dir"
          } >> "$GITHUB_ENV"

      - name: Install pinned DPDFNet model
        shell: bash
        run: |
          model_dir="$DENOIZE_MODEL_DIR/dpdfnet2-48khz-hr"
          mkdir -p "$model_dir" "$DENOIZE_EVIDENCE_DIR"
          model="$model_dir/dpdfnet2_48khz_hr.onnx"
          curl --fail --location --retry 5 --output "$model" "$DPDFNET_MODEL_URL"
          test "$(sha256sum < "$model" | awk '{print $1}')" = "$DPDFNET_MODEL_SHA256"
          echo "DPDFNET_MODEL=$model" >> "$GITHUB_ENV"

      - name: Measure lowest-supported production path
        shell: bash
        env:
          DENOIZE_NEURAL_WORKER_EVIDENCE: ${{ runner.temp }}/dpdfnet-lowest-supported/worker.json
          DENOIZE_NEURAL_WORKER_SECONDS: ${{ inputs.stress_seconds || '60' }}
          RAYON_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          portable="$RUNNER_TEMP/portable-linux"
          chmod 755 "$portable/dpdfnet-stress-gate" "$portable/dpdfnet-worker-gate"
          "$portable/dpdfnet-stress-gate" \
            --model dpdfnet-daw --model-path "$DPDFNET_MODEL" \
            --seconds "${{ inputs.stress_seconds || '60' }}" --parallel 1 \
            --realtime-paced \
            --json "$DENOIZE_EVIDENCE_DIR/stress.json"
          "$portable/dpdfnet-worker-gate" \
            neural::tests::pinned_dpdfnet2_release_worker_measures_lowest_tier_capacity \
            --ignored --exact --nocapture
          python3 scripts/generate-dpdfnet-platform-evidence.py \
            --stress "$DENOIZE_EVIDENCE_DIR/stress.json" \
            --worker "$DENOIZE_EVIDENCE_DIR/worker.json" \
            --output "$DENOIZE_EVIDENCE_DIR/platform.json"

      - name: Preserve rejected lowest-supported diagnostics
        if: failure()
        # actions/upload-artifact v6.
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: dpdfnet-rejected-lowest-supported-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dpdfnet-lowest-supported
          if-no-files-found: warn
          retention-days: 7

      - name: Attest lowest-supported measurement
        id: attest-lowest
        # actions/attest v4.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/dpdfnet-lowest-supported/*.json

      - name: Upload lowest-supported evidence
        shell: bash
        run: |
          cp "${{ steps.attest-lowest.outputs.bundle-path }}" \
            "$DENOIZE_EVIDENCE_DIR/dpdfnet-lowest-supported.sigstore.json"

      - name: Preserve lowest-supported evidence
        # actions/upload-artifact v6.
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: dpdfnet-lowest-supported
          path: ${{ runner.temp }}/dpdfnet-lowest-supported
          if-no-files-found: error
          retention-days: 30
