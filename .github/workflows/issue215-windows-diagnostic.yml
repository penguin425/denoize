name: Issue 215 Windows diagnostic

on:
  push:
    branches:
      - fix/osara-neural-parameters

permissions:
  contents: read

jobs:
  reaper:
    name: REAPER 7.79 / ${{ matrix.case }}
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: Neural v0.82.0
            plugin: denoize Neural
            parameters: 4
            archive_url: https://github.com/penguin425/denoize/releases/download/v0.82.0/denoize-plugin-v0.82.0-x86_64-pc-windows-msvc.zip
            archive_sha256: 358CE6399E70BDBBA6B58562B161444B6164C4A593C7B9C7B60927BBFBA9F1C0
          - case: regular v0.82.0
            plugin: denoize
            parameters: 7
            archive_url: https://github.com/penguin425/denoize/releases/download/v0.82.0/denoize-plugin-v0.82.0-x86_64-pc-windows-msvc.zip
            archive_sha256: 358CE6399E70BDBBA6B58562B161444B6164C4A593C7B9C7B60927BBFBA9F1C0
          - case: Neural v0.90.0
            plugin: denoize Neural
            parameters: 4
            archive_url: https://github.com/penguin425/denoize/releases/download/v0.90.0/denoize-plugin-v0.90.0-x86_64-pc-windows-msvc.zip
            archive_sha256: 4BCE101B95148DD5DF1FDF6DC095F7962F13082F54D4D8039BCA9AFB8BD93127
    steps:
      - name: Check out diagnostic script
        uses: actions/checkout@v6

      - name: Exercise OSARA parameter path
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $reaperInstaller = Join-Path $env:RUNNER_TEMP "reaper779_x64-install.exe"
          $pluginArchive = Join-Path $env:RUNNER_TEMP "denoize-plugin-v0.82.0.zip"
          $reaperDir = Join-Path $env:RUNNER_TEMP "reaper779"
          $pluginDir = Join-Path $env:RUNNER_TEMP "denoize-v082"
          $resourceDir = Join-Path $env:RUNNER_TEMP "reaper-resource"
          $diagnosticDir = Join-Path $env:RUNNER_TEMP "reaper-diagnostics"
          $result = Join-Path $env:RUNNER_TEMP "reaper-parameters.tsv"
          $tone = Join-Path $env:RUNNER_TEMP "tone.wav"

          Invoke-WebRequest -Uri https://www.reaper.fm/files/7.x/reaper779_x64-install.exe -OutFile $reaperInstaller
          if ((Get-FileHash $reaperInstaller -Algorithm SHA256).Hash -ne "F07714D894A073DF40E88568F8AA524A74230F574B0688DF681F9B7C0877F9DF") {
            throw "unexpected REAPER installer digest"
          }
          Invoke-WebRequest -Uri "${{ matrix.archive_url }}" -OutFile $pluginArchive
          if ((Get-FileHash $pluginArchive -Algorithm SHA256).Hash -ne "${{ matrix.archive_sha256 }}") {
            throw "unexpected denoize plug-in archive digest"
          }

          New-Item -ItemType Directory -Force $reaperDir, $pluginDir, $resourceDir, $diagnosticDir | Out-Null
          Start-Process -FilePath $reaperInstaller -ArgumentList "/S", "/D=$reaperDir" -Wait
          Expand-Archive -LiteralPath $pluginArchive -DestinationPath $pluginDir
          $reaper = Join-Path $reaperDir "reaper.exe"
          $plugin = Get-ChildItem $pluginDir -Recurse -File -Filter "denoize.clap" |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not (Test-Path $reaper) -or -not $plugin) {
            throw "REAPER or denoize.clap was not installed"
          }

          @(
            "[reaper]",
            "loadlastproj=0",
            "warnmaxram64=0",
            "[audioconfig]",
            "mode=5",
            "dummy_blocksize=1024",
            "dummy_srate=48000"
          ) |
            Set-Content -LiteralPath (Join-Path $resourceDir "reaper.ini") -Encoding ascii

          $sampleRate = 48000
          $sampleCount = $sampleRate * 2
          $dataSize = $sampleCount * 2
          $writer = [System.IO.BinaryWriter]::new([System.IO.File]::Create($tone))
          try {
            $writer.Write([System.Text.Encoding]::ASCII.GetBytes("RIFF"))
            $writer.Write([int](36 + $dataSize))
            $writer.Write([System.Text.Encoding]::ASCII.GetBytes("WAVEfmt "))
            $writer.Write([int]16)
            $writer.Write([int16]1)
            $writer.Write([int16]1)
            $writer.Write([int]$sampleRate)
            $writer.Write([int]($sampleRate * 2))
            $writer.Write([int16]2)
            $writer.Write([int16]16)
            $writer.Write([System.Text.Encoding]::ASCII.GetBytes("data"))
            $writer.Write([int]$dataSize)
            for ($sample = 0; $sample -lt $sampleCount; $sample++) {
              $value = [int16](12000 * [Math]::Sin(2 * [Math]::PI * 440 * $sample / $sampleRate))
              $writer.Write($value)
            }
          } finally {
            $writer.Dispose()
          }

          $env:CLAP_PATH = Split-Path $plugin
          $env:DENOIZE_REAPER_RESULT = $result
          $env:DENOIZE_REAPER_PLUGIN = "${{ matrix.plugin }}"
          $env:DENOIZE_REAPER_OSARA_STYLE = "1"
          $env:DENOIZE_REAPER_SET_DELAY = "1"
          $env:DENOIZE_REAPER_AUDIO = $tone
          $env:DENOIZE_REAPER_PLAY = "1"
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;

          public static class ReaperDialog {
              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              public static extern IntPtr FindWindow(string className, string windowName);

              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              public static extern IntPtr FindWindowEx(
                  IntPtr parent,
                  IntPtr childAfter,
                  string className,
                  string windowName
              );

              [DllImport("user32.dll")]
              public static extern IntPtr GetDlgItem(IntPtr dialog, int controlId);

              [DllImport("user32.dll")]
              public static extern IntPtr SendMessage(
                  IntPtr window,
                  uint message,
                  IntPtr word,
                  IntPtr data
              );
          }
          "@
          $arguments = @(
            "-newinst",
            "-cfgfile",
            (Join-Path $resourceDir "reaper.ini"),
            (Join-Path $env:GITHUB_WORKSPACE "scripts/reaper-clap-parameter-smoke.lua")
          )
          $process = Start-Process -FilePath $reaper -ArgumentList $arguments -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(30)
            do {
              Start-Sleep -Milliseconds 500
              $dialog = [ReaperDialog]::FindWindow("#32770", "REAPER")
              if ($dialog -ne [IntPtr]::Zero) {
                $noButton = [ReaperDialog]::GetDlgItem($dialog, 7)
                if ($noButton -eq [IntPtr]::Zero) {
                  $noButton = [ReaperDialog]::FindWindowEx(
                    $dialog,
                    [IntPtr]::Zero,
                    "Button",
                    "&No"
                  )
                }
                if ($noButton -ne [IntPtr]::Zero) {
                  [void][ReaperDialog]::SendMessage(
                    $noButton,
                    0x00F5,
                    [IntPtr]::Zero,
                    [IntPtr]::Zero
                  )
                }
              }
              if (Test-Path $result) {
                $evidence = Get-Content -LiteralPath $result
                if ($evidence -match '^summary\t') {
                  break
                }
              }
              if ($process.HasExited) {
                throw "REAPER exited before producing parameter evidence"
              }
            } while ((Get-Date) -lt $deadline)
          } finally {
            if (-not (Test-Path $result)) {
              Get-Process reaper -ErrorAction SilentlyContinue |
                Format-List Id, ProcessName, MainWindowHandle, MainWindowTitle, Responding |
                Out-String |
                Tee-Object -FilePath (Join-Path $diagnosticDir "processes.txt") |
                Write-Host
              Get-ChildItem $resourceDir -Recurse -Force |
                Select-Object FullName, Length, LastWriteTime |
                Format-Table -AutoSize |
                Out-String |
                Tee-Object -FilePath (Join-Path $diagnosticDir "resource-files.txt") |
                Write-Host
              $defaultResource = Join-Path $env:APPDATA "REAPER"
              if (Test-Path $defaultResource) {
                Get-ChildItem $defaultResource -Recurse -Force |
                  Select-Object FullName, Length, LastWriteTime |
                  Format-Table -AutoSize |
                  Out-String |
                  Tee-Object -FilePath (Join-Path $diagnosticDir "default-resource-files.txt") |
                  Write-Host
              }
              try {
                Add-Type -AssemblyName System.Windows.Forms
                Add-Type -AssemblyName System.Drawing
                $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
                $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
                $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
                $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
                $bitmap.Save((Join-Path $diagnosticDir "desktop.png"))
                $graphics.Dispose()
                $bitmap.Dispose()
              } catch {
                $_ | Out-String | Set-Content (Join-Path $diagnosticDir "screenshot-error.txt")
              }
            }
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

          if (-not (Test-Path $result)) {
            throw "REAPER did not produce parameter evidence"
          }
          $evidence = Get-Content -LiteralPath $result
          $evidence | ForEach-Object { Write-Host $_ }
          $parameters = @($evidence | Where-Object { $_ -match '^parameter\t' })
          if ($parameters.Count -ne ${{ matrix.parameters }} -or $evidence -notcontains "summary`t0") {
            throw "one or more OSARA-visible parameters were not adjustable"
          }

      - name: Upload runner diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: issue215-windows-diagnostics-${{ strategy.job-index }}
          path: ${{ runner.temp }}/reaper-diagnostics
          if-no-files-found: ignore
