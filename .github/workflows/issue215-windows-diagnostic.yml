name: Issue 215 Windows diagnostic

on:
  push:
    branches:
      - fix/osara-neural-parameters

permissions:
  contents: read

jobs:
  reaper:
    name: REAPER 7.79 / ${{ matrix.case }}
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: regular v0.82.0
            plugin: denoize
            parameters: 7
            normalized: 0
            model: 0
            archive_url: https://github.com/penguin425/denoize/releases/download/v0.82.0/denoize-plugin-v0.82.0-x86_64-pc-windows-msvc.zip
            archive_sha256: 358CE6399E70BDBBA6B58562B161444B6164C4A593C7B9C7B60927BBFBA9F1C0
          - case: Neural v0.82.0
            plugin: denoize Neural
            parameters: 4
            normalized: 0
            model: 1
            archive_url: https://github.com/penguin425/denoize/releases/download/v0.82.0/denoize-plugin-v0.82.0-x86_64-pc-windows-msvc.zip
            archive_sha256: 358CE6399E70BDBBA6B58562B161444B6164C4A593C7B9C7B60927BBFBA9F1C0
          - case: Neural v0.90.0
            plugin: denoize Neural
            parameters: 4
            normalized: 0
            model: 1
            archive_url: https://github.com/penguin425/denoize/releases/download/v0.90.0/denoize-plugin-v0.90.0-x86_64-pc-windows-msvc.zip
            archive_sha256: 4BCE101B95148DD5DF1FDF6DC095F7962F13082F54D4D8039BCA9AFB8BD93127
    steps:
      - name: Check out diagnostic script
        uses: actions/checkout@v6

      - name: Exercise OSARA parameter path
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $reaperInstaller = Join-Path $env:RUNNER_TEMP "reaper779_x64-install.exe"
          $pluginArchive = Join-Path $env:RUNNER_TEMP "denoize-plugin-v0.82.0.zip"
          $reaperDir = Join-Path $env:RUNNER_TEMP "reaper779"
          $pluginDir = Join-Path $env:RUNNER_TEMP "denoize-v082"
          $resourceDir = Join-Path $env:RUNNER_TEMP "reaper-resource"
          $diagnosticDir = Join-Path $env:RUNNER_TEMP "reaper-diagnostics"
          $result = Join-Path $env:RUNNER_TEMP "reaper-parameters.tsv"
          $tone = Join-Path $env:RUNNER_TEMP "tone.wav"
          $modelRoot = Join-Path $env:RUNNER_TEMP "denoize-models"

          Invoke-WebRequest -Uri https://www.reaper.fm/files/7.x/reaper779_x64-install.exe -OutFile $reaperInstaller
          if ((Get-FileHash $reaperInstaller -Algorithm SHA256).Hash -ne "F07714D894A073DF40E88568F8AA524A74230F574B0688DF681F9B7C0877F9DF") {
            throw "unexpected REAPER installer digest"
          }
          Invoke-WebRequest -Uri "${{ matrix.archive_url }}" -OutFile $pluginArchive
          if ((Get-FileHash $pluginArchive -Algorithm SHA256).Hash -ne "${{ matrix.archive_sha256 }}") {
            throw "unexpected denoize plug-in archive digest"
          }

          New-Item -ItemType Directory -Force $reaperDir, $pluginDir, $resourceDir, $diagnosticDir | Out-Null
          Start-Process -FilePath $reaperInstaller -ArgumentList "/S", "/D=$reaperDir" -Wait
          Expand-Archive -LiteralPath $pluginArchive -DestinationPath $pluginDir
          $reaper = Join-Path $reaperDir "reaper.exe"
          $plugin = Get-ChildItem $pluginDir -Recurse -File -Filter "denoize.clap" |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not (Test-Path $reaper) -or -not $plugin) {
            throw "REAPER or denoize.clap was not installed"
          }

          if ("${{ matrix.model }}" -eq "1") {
            $modelDir = Join-Path $modelRoot "gtcrn-dns3"
            $model = Join-Path $modelDir "gtcrn_simple.onnx"
            New-Item -ItemType Directory -Force $modelDir | Out-Null
            Invoke-WebRequest `
              -Uri https://raw.githubusercontent.com/Xiaobin-Rong/gtcrn/3862c44808dca492ea5a8a145d2dc2a1028d08c8/stream/onnx_models/gtcrn_simple.onnx `
              -OutFile $model
            if ((Get-FileHash $model -Algorithm SHA256).Hash -ne "B4718DF6228E7BDF1A8A435CF98F838636EB2FD331ACABF86BA87C5192EBCB87") {
              throw "unexpected GTCRN model digest"
            }
            $env:DENOIZE_MODEL_DIR = $modelRoot
          }

          @(
            "[reaper]",
            "loadlastproj=0",
            "warnmaxram64=0",
            "[audioconfig]",
            "mode=5",
            "dummy_blocksize=1024",
            "dummy_srate=48000"
          ) |
            Set-Content -LiteralPath (Join-Path $resourceDir "reaper.ini") -Encoding ascii

          $sampleRate = 48000
          $sampleCount = $sampleRate * 10
          $dataSize = $sampleCount * 2
          $writer = [System.IO.BinaryWriter]::new([System.IO.File]::Create($tone))
          try {
            $writer.Write([System.Text.Encoding]::ASCII.GetBytes("RIFF"))
            $writer.Write([int](36 + $dataSize))
            $writer.Write([System.Text.Encoding]::ASCII.GetBytes("WAVEfmt "))
            $writer.Write([int]16)
            $writer.Write([int16]1)
            $writer.Write([int16]1)
            $writer.Write([int]$sampleRate)
            $writer.Write([int]($sampleRate * 2))
            $writer.Write([int16]2)
            $writer.Write([int16]16)
            $writer.Write([System.Text.Encoding]::ASCII.GetBytes("data"))
            $writer.Write([int]$dataSize)
            for ($sample = 0; $sample -lt $sampleCount; $sample++) {
              $value = [int16](12000 * [Math]::Sin(2 * [Math]::PI * 440 * $sample / $sampleRate))
              $writer.Write($value)
            }
          } finally {
            $writer.Dispose()
          }

          $env:CLAP_PATH = Split-Path $plugin
          $env:DENOIZE_REAPER_RESULT = $result
          $env:DENOIZE_REAPER_PLUGIN = "${{ matrix.plugin }}"
          $env:DENOIZE_REAPER_OSARA_STYLE = "1"
          $env:DENOIZE_REAPER_NORMALIZED = "${{ matrix.normalized }}"
          $env:DENOIZE_REAPER_PLAY_DELAY = "3"
          $env:DENOIZE_REAPER_SET_DELAY = "5"
          $env:DENOIZE_REAPER_AUDIO = $tone
          $env:DENOIZE_REAPER_PLAY = "1"
          $env:DENOIZE_REAPER_OPEN_AUDIO_DEVICE = "1"
          Add-Type @"
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          using System.Text;

          public static class ReaperDialog {
              public delegate bool EnumWindowsProc(IntPtr window, IntPtr data);

              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              public static extern IntPtr FindWindow(string className, string windowName);

              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              public static extern IntPtr FindWindowEx(
                  IntPtr parent,
                  IntPtr childAfter,
                  string className,
                  string windowName
              );

              [DllImport("user32.dll")]
              public static extern IntPtr GetDlgItem(IntPtr dialog, int controlId);

              [DllImport("user32.dll")]
              public static extern int GetDlgCtrlID(IntPtr window);

              [DllImport("user32.dll")]
              public static extern IntPtr GetParent(IntPtr window);

              [DllImport("user32.dll")]
              public static extern bool IsWindowVisible(IntPtr window);

              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              public static extern int GetClassName(
                  IntPtr window,
                  StringBuilder className,
                  int maximum
              );

              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              public static extern int GetWindowText(
                  IntPtr window,
                  StringBuilder text,
                  int maximum
              );

              [DllImport("user32.dll")]
              public static extern bool EnumChildWindows(
                  IntPtr parent,
                  EnumWindowsProc callback,
                  IntPtr data
              );

              [DllImport("user32.dll")]
              public static extern IntPtr SendMessage(
                  IntPtr window,
                  uint message,
                  IntPtr word,
                  IntPtr data
              );

              [DllImport("user32.dll", CharSet = CharSet.Unicode, EntryPoint = "SendMessageW")]
              public static extern IntPtr SendMessageString(
                  IntPtr window,
                  uint message,
                  IntPtr word,
                  StringBuilder data
              );

              public static IntPtr[] Descendants(IntPtr parent) {
                  var children = new List<IntPtr>();
                  EnumChildWindows(parent, delegate(IntPtr window, IntPtr data) {
                      children.Add(window);
                      return true;
                  }, IntPtr.Zero);
                  return children.ToArray();
              }

              public static string ClassName(IntPtr window) {
                  var value = new StringBuilder(256);
                  GetClassName(window, value, value.Capacity);
                  return value.ToString();
              }

              public static string WindowText(IntPtr window) {
                  var value = new StringBuilder(1024);
                  GetWindowText(window, value, value.Capacity);
                  return value.ToString();
              }

              public static string ComboItem(IntPtr combo, int index) {
                  var value = new StringBuilder(1024);
                  SendMessageString(combo, 0x0148, new IntPtr(index), value);
                  return value.ToString();
              }
          }
          "@
          $arguments = @(
            "-newinst",
            "-cfgfile",
            (Join-Path $resourceDir "reaper.ini"),
            (Join-Path $env:GITHUB_WORKSPACE "scripts/reaper-clap-parameter-smoke.lua")
          )
          $process = Start-Process -FilePath $reaper -ArgumentList $arguments -PassThru
          $promptAccepted = $false
          $preferencesConfigured = $false
          $windowEvidence = [System.Collections.Generic.List[string]]::new()
          try {
            $deadline = (Get-Date).AddSeconds(30)
            do {
              Start-Sleep -Milliseconds 500
              $dialog = [ReaperDialog]::FindWindow("#32770", "REAPER")
              if (-not $promptAccepted -and $dialog -ne [IntPtr]::Zero) {
                $yesButton = [ReaperDialog]::GetDlgItem($dialog, 6)
                if ($yesButton -ne [IntPtr]::Zero) {
                  [void][ReaperDialog]::SendMessage(
                    $yesButton,
                    0x00F5,
                    [IntPtr]::Zero,
                    [IntPtr]::Zero
                  )
                  $promptAccepted = $true
                  $windowEvidence.Add("accepted audio setup prompt")
                }
              }
              $preferences = [ReaperDialog]::FindWindow("#32770", "REAPER Preferences")
              if (-not $preferencesConfigured -and $preferences -ne [IntPtr]::Zero) {
                $dummyAudioSelected = $false
                foreach ($child in [ReaperDialog]::Descendants($preferences)) {
                  $className = [ReaperDialog]::ClassName($child)
                  $controlId = [ReaperDialog]::GetDlgCtrlID($child)
                  $text = [ReaperDialog]::WindowText($child)
                  $visible = [ReaperDialog]::IsWindowVisible($child)
                  $windowEvidence.Add(
                    "$child`t$className`t$controlId`t$visible`t$text"
                  )
                  if ($className -ne "ComboBox" -or $controlId -ne 1000) {
                    continue
                  }
                  $count = [int][ReaperDialog]::SendMessage(
                    $child,
                    0x0146,
                    [IntPtr]::Zero,
                    [IntPtr]::Zero
                  )
                  for ($index = 0; $index -lt $count; $index++) {
                    $item = [ReaperDialog]::ComboItem($child, $index)
                    $windowEvidence.Add("combo 1000 item $index`t$item")
                    if ($item -eq "Dummy Audio") {
                      [void][ReaperDialog]::SendMessage(
                        $child,
                        0x014E,
                        [IntPtr]$index,
                        [IntPtr]::Zero
                      )
                      $parent = [ReaperDialog]::GetParent($child)
                      [void][ReaperDialog]::SendMessage(
                        $parent,
                        0x0111,
                        [IntPtr](1000 -bor (1 -shl 16)),
                        $child
                      )
                      $dummyAudioSelected = $true
                      $windowEvidence.Add("selected Dummy Audio at combo index $index")
                      break
                    }
                  }
                }
                if ($dummyAudioSelected) {
                  Start-Sleep -Milliseconds 500
                  $applyButton = [ReaperDialog]::GetDlgItem($preferences, 1144)
                  if ($applyButton -ne [IntPtr]::Zero) {
                    [void][ReaperDialog]::SendMessage(
                      $applyButton,
                      0x00F5,
                      [IntPtr]::Zero,
                      [IntPtr]::Zero
                    )
                  }
                  Start-Sleep -Milliseconds 500
                  $okButton = [ReaperDialog]::GetDlgItem($preferences, 1)
                  [void][ReaperDialog]::SendMessage(
                    $okButton,
                    0x00F5,
                    [IntPtr]::Zero,
                    [IntPtr]::Zero
                  )
                  $preferencesConfigured = $true
                }
              }
              if (Test-Path $result) {
                $evidence = Get-Content -LiteralPath $result
                if ($evidence -match '^summary\t') {
                  break
                }
              }
              if ($process.HasExited) {
                throw "REAPER exited before producing parameter evidence"
              }
            } while ((Get-Date) -lt $deadline)
          } finally {
            $windowEvidence |
              Set-Content -LiteralPath (Join-Path $diagnosticDir "windows.tsv")
            Copy-Item -LiteralPath (Join-Path $resourceDir "reaper.ini") `
              -Destination (Join-Path $diagnosticDir "reaper.ini") -Force
            try {
              Add-Type -AssemblyName System.Windows.Forms
              Add-Type -AssemblyName System.Drawing
              $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
              $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
              $graphics.CopyFromScreen(
                $bounds.Location,
                [System.Drawing.Point]::Empty,
                $bounds.Size
              )
              $bitmap.Save((Join-Path $diagnosticDir "desktop.png"))
              $graphics.Dispose()
              $bitmap.Dispose()
            } catch {
              $_ | Out-String |
                Set-Content (Join-Path $diagnosticDir "screenshot-error.txt")
            }
            if (-not (Test-Path $result)) {
              Get-Process reaper -ErrorAction SilentlyContinue |
                Format-List Id, ProcessName, MainWindowHandle, MainWindowTitle, Responding |
                Out-String |
                Tee-Object -FilePath (Join-Path $diagnosticDir "processes.txt") |
                Write-Host
              Get-ChildItem $resourceDir -Recurse -Force |
                Select-Object FullName, Length, LastWriteTime |
                Format-Table -AutoSize |
                Out-String |
                Tee-Object -FilePath (Join-Path $diagnosticDir "resource-files.txt") |
                Write-Host
              $defaultResource = Join-Path $env:APPDATA "REAPER"
              if (Test-Path $defaultResource) {
                Get-ChildItem $defaultResource -Recurse -Force |
                  Select-Object FullName, Length, LastWriteTime |
                  Format-Table -AutoSize |
                  Out-String |
                  Tee-Object -FilePath (Join-Path $diagnosticDir "default-resource-files.txt") |
                  Write-Host
              }
            }
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

          if (-not (Test-Path $result)) {
            throw "REAPER did not produce parameter evidence"
          }
          $evidence = Get-Content -LiteralPath $result
          $evidence | ForEach-Object { Write-Host $_ }
          $parameters = @($evidence | Where-Object { $_ -match '^parameter\t' })
          if ($parameters.Count -ne ${{ matrix.parameters }} -or $evidence -notcontains "summary`t0") {
            throw "one or more OSARA-visible parameters were not adjustable"
          }

      - name: Upload runner diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: issue215-windows-diagnostics-${{ strategy.job-index }}
          path: ${{ runner.temp }}/reaper-diagnostics
          if-no-files-found: ignore
