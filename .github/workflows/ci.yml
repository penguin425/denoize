name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-security:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit CLI and library dependencies
        run: cargo audit --file Cargo.lock

      - name: Audit desktop dependencies
        run: cargo audit --file apps/desktop/src-tauri/Cargo.lock

      - name: Audit fuzz harness dependencies
        run: cargo audit --file fuzz/Cargo.lock

      - name: Audit crates.io dependencies
        run: bash scripts/publish-crates-io.sh --audit

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Select minimum supported Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0

      - name: Install live audio development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libasound2-dev python3-jsonschema

      - name: Verify synchronized release versions
        run: bash scripts/verify-release-version.sh

      - name: Test all features
        run: cargo test --locked --all-targets --features full

      - name: Check feature-unified workspace
        run: cargo check --locked --workspace --all-features

      - name: Validate project JSON contracts
        run: python3 scripts/test-project-schemas.py --denoize target/debug/denoize

      - name: Validate runtime model package JSON contracts
        run: python3 scripts/test-runtime-model-package-schemas.py

      - name: Validate native diagnostic JSON contracts
        run: python3 scripts/test-diagnostic-schemas.py --denoize target/debug/denoize

      - name: Validate deterministic restoration JSON contracts
        run: python3 scripts/test-restoration-schemas.py

      - name: Validate universal restoration JSON contracts
        run: python3 scripts/test-universal-restoration-schemas.py

      - name: Validate neural DAW JSON contracts
        run: python3 scripts/test-neural-daw-schemas.py --denoize target/debug/denoize

      - name: Validate DPDFNet promotion evidence contracts
        run: python3 scripts/test-dpdfnet-promotion-evidence.py

      - name: Validate target-speaker JSON contracts
        run: python3 scripts/test-target-speaker-schemas.py

      - name: Validate target-sound JSON contracts
        run: python3 scripts/test-target-sound-schemas.py

      - name: Validate causal target-sound JSON contracts
        run: python3 scripts/test-causal-target-sound-schemas.py

      - name: Validate acoustic echo cancellation JSON contracts
        run: python3 scripts/test-aec-schemas.py

      - name: Validate microphone-array JSON contracts
        run: python3 scripts/test-microphone-array-schemas.py

      - name: Validate meeting speaker-track JSON contracts
        run: python3 scripts/test-meeting-speaker-schemas.py

      - name: Validate music-restoration JSON contracts
        run: python3 scripts/test-music-restoration-schemas.py

      - name: Run bounded deterministic resilience matrix
        env:
          DENOIZE_RESILIENCE_FEATURES: full
          DENOIZE_RESILIENCE_TIMEOUT_SECONDS: "180"
        run: bash scripts/test-resilience.sh

      - name: Validate DeepFilterNet speech quality
        run: |
          cargo build --locked --features full --bin denoize
          python3 scripts/validate-deepfilter.py --denoize target/debug/denoize

      - name: Test licensed-corpus evaluation evidence
        env:
          DENOIZE_BIN: target/debug/denoize
        run: bash scripts/test-evaluation-evidence.sh

      - name: Test crates.io feature set
        run: bash scripts/publish-crates-io.sh --test

      - name: Check release scripts
        run: |
          bash -n \
            scripts/build-auv3-plugin.sh \
            scripts/build-lv2-plugin.sh \
            scripts/build-offline-model-bundle.sh \
            scripts/build-vst3-plugin.sh \
            scripts/generate-cli-docs.sh \
            scripts/package-auv3-plugin.sh \
            scripts/package-android-sdk.sh \
            scripts/package-c-sdk.sh \
            scripts/package-ios-sdk.sh \
            scripts/package-clap-plugin.sh \
            scripts/package-dpdfnet-experimental-clap.sh \
            scripts/package-lv2-plugin.sh \
            scripts/package-vst3-plugin.sh \
            scripts/package-web-sdk.sh \
            scripts/package-release-evidence.sh \
            scripts/publish-crates-io.sh \
            scripts/release-evidence-assets.sh \
            scripts/test-clap-editor-host.sh \
            scripts/test-auv3-host.sh \
            scripts/test-evaluation-evidence.sh \
            scripts/test-lv2-ardour-host.sh \
            scripts/test-lv2-jalv-host.sh \
            scripts/test-resilience.sh \
            scripts/test-release-evidence.sh \
            scripts/test-c-sdk.sh \
            scripts/test-wasm-sdk.sh \
            scripts/test-vst3-ardour-host.sh \
            scripts/verify-release-assets.sh \
            scripts/verify-release-evidence.sh \
            scripts/verify-release-version.sh \
            scripts/validate-auv3-plugin.sh \
            scripts/validate-lv2-plugin.sh \
            scripts/validate-vst3-plugin.sh
          python3 -c 'compile(open("scripts/generate-auv3-host-evidence.py", encoding="utf-8").read(), "scripts/generate-auv3-host-evidence.py", "exec")'
          python3 -c 'compile(open("scripts/generate-release-evidence.py", encoding="utf-8").read(), "scripts/generate-release-evidence.py", "exec")'
          python3 -c 'compile(open("scripts/assemble-release-updater-metadata.py", encoding="utf-8").read(), "scripts/assemble-release-updater-metadata.py", "exec")'
          python3 -c 'compile(open("scripts/assemble-application-update.py", encoding="utf-8").read(), "scripts/assemble-application-update.py", "exec")'
          python3 -c 'compile(open("scripts/test-application-update-manifest.py", encoding="utf-8").read(), "scripts/test-application-update-manifest.py", "exec")'
          python3 -c 'compile(open("scripts/test-diagnostic-schemas.py", encoding="utf-8").read(), "scripts/test-diagnostic-schemas.py", "exec")'
          python3 -c 'compile(open("scripts/test-project-schemas.py", encoding="utf-8").read(), "scripts/test-project-schemas.py", "exec")'
          python3 -c 'compile(open("scripts/test-restoration-schemas.py", encoding="utf-8").read(), "scripts/test-restoration-schemas.py", "exec")'
          python3 -c 'compile(open("scripts/test-universal-restoration-schemas.py", encoding="utf-8").read(), "scripts/test-universal-restoration-schemas.py", "exec")'
          python3 -c 'compile(open("scripts/test-neural-daw-schemas.py", encoding="utf-8").read(), "scripts/test-neural-daw-schemas.py", "exec")'
          python3 -c 'compile(open("scripts/prepare-dpdfnet-blind-listening.py", encoding="utf-8").read(), "scripts/prepare-dpdfnet-blind-listening.py", "exec")'
          python3 -c 'compile(open("scripts/recover-dpdfnet-blind-answer-key.py", encoding="utf-8").read(), "scripts/recover-dpdfnet-blind-answer-key.py", "exec")'
          python3 -c 'compile(open("scripts/score-dpdfnet-blind-listening.py", encoding="utf-8").read(), "scripts/score-dpdfnet-blind-listening.py", "exec")'
          python3 -c 'compile(open("scripts/generate-dpdfnet-platform-evidence.py", encoding="utf-8").read(), "scripts/generate-dpdfnet-platform-evidence.py", "exec")'
          python3 -c 'compile(open("scripts/generate-dpdfnet-promotion-evidence.py", encoding="utf-8").read(), "scripts/generate-dpdfnet-promotion-evidence.py", "exec")'
          python3 -c 'compile(open("scripts/verify-dpdfnet-objective-equivalence.py", encoding="utf-8").read(), "scripts/verify-dpdfnet-objective-equivalence.py", "exec")'
          python3 -c 'compile(open("scripts/fetch-dpdfnet-reporter-evidence.py", encoding="utf-8").read(), "scripts/fetch-dpdfnet-reporter-evidence.py", "exec")'
          python3 -c 'compile(open("scripts/test-dpdfnet-promotion-evidence.py", encoding="utf-8").read(), "scripts/test-dpdfnet-promotion-evidence.py", "exec")'
          python3 -c 'compile(open("scripts/test-target-speaker-schemas.py", encoding="utf-8").read(), "scripts/test-target-speaker-schemas.py", "exec")'
          python3 -c 'compile(open("scripts/test-target-sound-schemas.py", encoding="utf-8").read(), "scripts/test-target-sound-schemas.py", "exec")'
          python3 -c 'compile(open("scripts/test-causal-target-sound-schemas.py", encoding="utf-8").read(), "scripts/test-causal-target-sound-schemas.py", "exec")'
          python3 -c 'compile(open("scripts/test-aec-schemas.py", encoding="utf-8").read(), "scripts/test-aec-schemas.py", "exec")'
          python3 -c 'compile(open("scripts/test-microphone-array-schemas.py", encoding="utf-8").read(), "scripts/test-microphone-array-schemas.py", "exec")'
          python3 -c 'compile(open("scripts/test-meeting-speaker-schemas.py", encoding="utf-8").read(), "scripts/test-meeting-speaker-schemas.py", "exec")'
          python3 -c 'compile(open("scripts/test-music-restoration-schemas.py", encoding="utf-8").read(), "scripts/test-music-restoration-schemas.py", "exec")'
          python3 -c 'compile(open("scripts/generate-plugin-editor-evidence.py", encoding="utf-8").read(), "scripts/generate-plugin-editor-evidence.py", "exec")'
          python3 -c 'compile(open("scripts/generate-lv2-host-evidence.py", encoding="utf-8").read(), "scripts/generate-lv2-host-evidence.py", "exec")'
          python3 -c 'compile(open("scripts/test-plugin-editor-evidence.py", encoding="utf-8").read(), "scripts/test-plugin-editor-evidence.py", "exec")'
          python3 -c 'compile(open("scripts/test-lv2-host-evidence.py", encoding="utf-8").read(), "scripts/test-lv2-host-evidence.py", "exec")'
          python3 -c 'compile(open("scripts/generate-vst3-host-matrix.py", encoding="utf-8").read(), "scripts/generate-vst3-host-matrix.py", "exec")'
          python3 -c 'compile(open("scripts/test-vst3-host-matrix.py", encoding="utf-8").read(), "scripts/test-vst3-host-matrix.py", "exec")'
          python3 -c 'compile(open("scripts/test-auv3-host-evidence.py", encoding="utf-8").read(), "scripts/test-auv3-host-evidence.py", "exec")'
          python3 -c 'compile(open("scripts/test-runtime-model-package-schemas.py", encoding="utf-8").read(), "scripts/test-runtime-model-package-schemas.py", "exec")'
          python3 -c 'compile(open("scripts/test-sdk-contracts.py", encoding="utf-8").read(), "scripts/test-sdk-contracts.py", "exec")'
          python3 -c 'compile(open("scripts/test-release-updater-metadata.py", encoding="utf-8").read(), "scripts/test-release-updater-metadata.py", "exec")'
          for schema in schemas/*.schema.json; do
            jq -e '."$schema" == "https://json-schema.org/draft/2020-12/schema"' \
              "$schema" >/dev/null
          done

      - name: Test release evidence generation and offline verification
        run: |
          python3 scripts/test-application-update-manifest.py
          python3 scripts/test-plugin-editor-evidence.py
          python3 scripts/test-lv2-host-evidence.py
          python3 scripts/test-release-updater-metadata.py
          python3 scripts/test-vst3-host-matrix.py
          python3 scripts/test-auv3-host-evidence.py
          python3 scripts/test-dpdfnet-promotion-evidence.py
          bash scripts/test-release-evidence.sh

  clap-plugin:
    name: CLAP plug-in
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install embedded-editor host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends dbus-x11 libxtst6 python3-pip xvfb
          python3 -m pip install --user --disable-pip-version-check \
            'jsonschema==4.25.1'
          python3 -c 'from jsonschema import Draft202012Validator'

      - name: Select minimum supported Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0

      - name: Test real-time and portable-state contracts
        env:
          DENOIZE_MODEL_DIR: /tmp/denoize-clap-models-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          cargo run --locked --no-default-features --features gtcrn --bin denoize -- \
            models install gtcrn
          cargo test --locked -p denoize-clap
          cargo test --locked --release -p denoize-clap \
            neural::tests::pinned_gtcrn_release_worker_meets_sustained_deadlines -- --ignored --exact
          cargo test --locked --no-default-features --test daw_realtime_allocations
          cargo test --locked --no-default-features --test cli_daw_plugin

      - name: Build release plug-in
        run: cargo build --locked --release -p denoize-clap

      - name: Exercise both embedded editors in a real CLAP host
        shell: bash
        run: |
          report_dir=$(mktemp -d /tmp/denoize-clap-editor-report.XXXXXX)
          report="$report_dir/denoize-clap-editor-host-v9.8.7-x86_64-unknown-linux-gnu.txt"
          evidence="$report_dir/denoize-plugin-editor-evidence-v1.json"
          bash scripts/test-clap-editor-host.sh \
            target/release/libdenoize_clap.so "$report" >/dev/null
          python3 scripts/generate-plugin-editor-evidence.py \
            --tag v9.8.7 \
            --commit "$(git rev-parse HEAD)" \
            --repository "$GITHUB_REPOSITORY" \
            --operating-system ubuntu-22.04 \
            --architecture x86_64 \
            --report "$report" \
            --output "$evidence"
          python3 - "$evidence" <<'PY'
          import json
          from pathlib import Path
          import sys
          from jsonschema import Draft202012Validator
          schema = json.loads(Path("schemas/denoize-plugin-editor-evidence-v1.schema.json").read_text())
          document = json.loads(Path(sys.argv[1]).read_text())
          Draft202012Validator(schema).validate(document)
          PY

      - name: Validate with the pinned official CLAP validator
        shell: bash
        env:
          DENOIZE_MODEL_DIR: /tmp/denoize-clap-models-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          validator_dir=$(mktemp -d /tmp/denoize-clap-validator.XXXXXX)
          validator_zip="$validator_dir/clap-validator.zip"
          curl --fail --location --silent --show-error \
            https://github.com/free-audio/clap-validator/releases/download/0.4.1/clap-validator-0.4.1-127-g152b982-ubuntu-22.04.zip \
            --output "$validator_zip"
          echo "49edadcfb407ea0dd946ce418300e853fbd2660fa4b0d00e4f19ff8eef24ad90  $validator_zip" \
            | sha256sum --check
          unzip -q "$validator_zip" -d "$validator_dir"
          tar -xzf "$validator_dir"/*.tar.gz -C "$validator_dir"
          validator=$(find "$validator_dir" -type f -name clap-validator -perm -u+x -print -quit)
          test -n "$validator"
          cp target/release/libdenoize_clap.so "$validator_dir/denoize.clap"
          validator_status=1
          report_status=1
          for attempt in 1 2; do
            set +e
            "$validator" --verbosity quiet validate --json "$validator_dir/denoize.clap" \
              > "$validator_dir/report.json"
            validator_status=$?
            if [ "$validator_status" -eq 0 ]; then
              jq -e '
                (.results | length) == 81 and
                ([.results[].status.code] | map(select(. == "success")) | length) == 68 and
                ([.results[].status.code] | map(select(. == "skipped")) | length) == 13 and
                ([.results[].status.code] | all(. == "success" or . == "skipped"))
              ' "$validator_dir/report.json" >/dev/null
              report_status=$?
            else
              report_status=1
            fi
            set -e
            if [ "$validator_status" -eq 0 ] && [ "$report_status" -eq 0 ]; then
              break
            fi
            printf 'CLAP validator attempt %s failed: validator status %s, report contract status %s\n' \
              "$attempt" "$validator_status" "$report_status" >&2
          done
          if [ "$validator_status" -ne 0 ] || [ "$report_status" -ne 0 ]; then
            if jq -e . "$validator_dir/report.json" >/dev/null 2>&1; then
              jq . "$validator_dir/report.json" >&2
            else
              sed -n '1,200p' "$validator_dir/report.json" >&2
            fi
            exit 1
          fi

      - name: Test release archive layouts
        shell: bash
        run: |
          output_dir=$(mktemp -d /tmp/denoize-clap-package.XXXXXX)
          bash scripts/package-clap-plugin.sh \
            x86_64-unknown-linux-gnu v9.8.7 "$output_dir" \
            target/release/libdenoize_clap.so
          bash scripts/package-clap-plugin.sh \
            aarch64-apple-darwin v9.8.7 "$output_dir" \
            target/release/libdenoize_clap.so
          bash scripts/package-clap-plugin.sh \
            x86_64-pc-windows-msvc v9.8.7 "$output_dir" \
            target/release/libdenoize_clap.so
          tar -tzf "$output_dir/denoize-plugin-v9.8.7-x86_64-unknown-linux-gnu.tar.gz" \
            | grep -Fx 'denoize-plugin-v9.8.7-x86_64-unknown-linux-gnu/denoize.clap'
          tar -tzf "$output_dir/denoize-plugin-v9.8.7-aarch64-apple-darwin.tar.gz" \
            | grep -Fx 'denoize-plugin-v9.8.7-aarch64-apple-darwin/denoize.clap/Contents/Info.plist'
          unzip -t "$output_dir/denoize-plugin-v9.8.7-x86_64-pc-windows-msvc.zip"

  vst3-plugin:
    name: VST3 plug-in
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Select minimum supported Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            ardour=1:8.4.0+ds1-2ubuntu8 \
            libasound2-dev \
            python3-jsonschema

      - name: Install pinned neural model
        env:
          DENOIZE_MODEL_DIR: /tmp/denoize-vst3-models-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          cargo run --locked --no-default-features --features gtcrn --bin denoize -- \
            models install gtcrn

      - name: Build statically bound VST3 bundle
        shell: bash
        run: bash scripts/build-vst3-plugin.sh x86_64-unknown-linux-gnu

      - name: Check VST3 linkage hardening
        shell: bash
        run: |
          module=target/vst3-build/x86_64-unknown-linux-gnu/Release/denoize.vst3/Contents/x86_64-linux/denoize.so
          test -s "$module"
          nm -D "$module" | grep -Eq '[[:space:]]GetPluginFactory$'
          nm -D "$module" | grep -Eq '[[:space:]]clap_entry$'
          ldd "$module" | grep -Fq 'libopus.so.0'
          if ldd "$module" | grep -Fq 'not found'; then
            ldd "$module" >&2
            exit 1
          fi
          readelf -W -l "$module" | awk '
            /GNU_STACK/ { found = 1; if ($0 ~ /RWE/) exit 1 }
            END { if (!found) exit 1 }
          '
          readelf -d "$module" | grep -Fq 'BIND_NOW'

      - name: Validate both descriptors and exercise Ardour 8.4
        shell: bash
        env:
          DENOIZE_MODEL_DIR: /tmp/denoize-vst3-models-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          report_dir=$(mktemp -d /tmp/denoize-vst3-report.XXXXXX)
          bundle=target/vst3-build/x86_64-unknown-linux-gnu/Release/denoize.vst3
          report="$report_dir/denoize-vst3-validator-v9.8.7-x86_64-unknown-linux-gnu.txt"
          host_report="$report_dir/denoize-vst3-ardour-v9.8.7-x86_64-unknown-linux-gnu.txt"
          bash scripts/validate-vst3-plugin.sh "$bundle" "$report" >/dev/null
          bash scripts/test-vst3-ardour-host.sh "$bundle" "$host_report" >/dev/null
          python3 scripts/generate-vst3-host-matrix.py \
            --tag v9.8.7 \
            --commit "$(git rev-parse HEAD)" \
            --repository "$GITHUB_REPOSITORY" \
            --operating-system ubuntu-24.04 \
            --architecture x86_64 \
            --validator-report "$report" \
            --real-host-report "$host_report" \
            --output "$report_dir/denoize-vst3-host-matrix-v1.json"
          python3 - "$report_dir/denoize-vst3-host-matrix-v1.json" <<'PY'
          import json
          from pathlib import Path
          import sys
          from jsonschema import Draft202012Validator
          schema = json.loads(Path("schemas/denoize-plugin-host-matrix-v1.schema.json").read_text())
          document = json.loads(Path(sys.argv[1]).read_text())
          Draft202012Validator(schema).validate(document)
          PY

      - name: Test VST3 release archive layouts
        shell: bash
        run: |
          output_dir=$(mktemp -d /tmp/denoize-vst3-package.XXXXXX)
          bundle=target/vst3-build/x86_64-unknown-linux-gnu/Release/denoize.vst3
          bash scripts/package-vst3-plugin.sh \
            x86_64-unknown-linux-gnu v9.8.7 "$output_dir"
          single_config_bundle=target/vst3-build/aarch64-apple-darwin/denoize.vst3
          mkdir -p "$(dirname "$single_config_bundle")"
          cp -R "$bundle" "$single_config_bundle"
          bash scripts/package-vst3-plugin.sh \
            aarch64-apple-darwin v9.8.7 "$output_dir"
          bash scripts/package-vst3-plugin.sh \
            x86_64-pc-windows-msvc v9.8.7 "$output_dir" "$bundle"
          tar -tzf "$output_dir/denoize-vst3-v9.8.7-x86_64-unknown-linux-gnu.tar.gz" \
            | grep -F 'denoize.vst3/Contents/x86_64-linux/denoize.so' >/dev/null
          tar -tzf "$output_dir/denoize-vst3-v9.8.7-aarch64-apple-darwin.tar.gz" \
            | grep -F 'denoize.vst3/Contents/x86_64-linux/denoize.so' >/dev/null
          unzip -t "$output_dir/denoize-vst3-v9.8.7-x86_64-pc-windows-msvc.zip"

  vst3-cross-platform:
    name: VST3 cross-platform build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Select minimum supported Rust
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0
          rustup target add "${{ matrix.target }}"

      - name: Build statically bound VST3 bundle
        shell: bash
        run: bash scripts/build-vst3-plugin.sh "${{ matrix.target }}"

      - name: Verify package layout
        shell: bash
        run: |
          bundle=$(find "target/vst3-build/${{ matrix.target }}" \
            -type d -name denoize.vst3 -print -quit)
          if [[ -z "$bundle" ]]; then
            bundle=$(find "target/vst3-build/${{ matrix.target }}" \
              -type f -name denoize.vst3 -print -quit)
          fi
          test -n "$bundle"
          output_dir="$RUNNER_TEMP/denoize-vst3-package"
          mkdir -p "$output_dir"
          output_dir=$(cd -- "$output_dir" && pwd)
          archive=$(bash scripts/package-vst3-plugin.sh \
            "${{ matrix.target }}" v9.8.7 "$output_dir" "$bundle")
          test "$archive" = \
            "$output_dir/denoize-vst3-v9.8.7-${{ matrix.target }}.${{ matrix.archive }}"
          test -s "$archive"

  lv2-plugin:
    name: LV2 plug-in
    runs-on: ubuntu-24.04
    env:
      DENOIZE_MODEL_DIR: /tmp/denoize-lv2-models-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Select minimum supported Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0

      - name: Install pinned LV2 validation and host dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            ardour=1:8.4.0+ds1-2ubuntu8 \
            jackd2=1.9.21~dfsg-3ubuntu3 \
            jalv=1.6.8-1build3 \
            libasound2-dev \
            lilv-utils=0.24.22-1build1 \
            lv2-dev=1.18.10-2build1 \
            python3-jsonschema \
            sordi=0.16.16-2build1

      - name: Install pinned neural model
        run: |
          cargo run --locked --no-default-features --features gtcrn --bin denoize -- \
            models install gtcrn

      - name: Test direct LV2 adapter contracts
        run: cargo test --locked -p denoize-lv2 --lib

      - name: Build hardened LV2 bundle
        run: bash scripts/build-lv2-plugin.sh x86_64-unknown-linux-gnu

      - name: Validate and exercise Jalv and Ardour
        run: |
          report_dir=$(mktemp -d /tmp/denoize-lv2-report.XXXXXX)
          bundle=target/lv2-build/x86_64-unknown-linux-gnu/denoize.lv2
          validation="$report_dir/denoize-lv2-validation-v9.8.7-x86_64-unknown-linux-gnu.txt"
          jalv="$report_dir/denoize-lv2-jalv-v9.8.7-x86_64-unknown-linux-gnu.txt"
          ardour="$report_dir/denoize-lv2-ardour-v9.8.7-x86_64-unknown-linux-gnu.txt"
          evidence="$report_dir/denoize-lv2-host-evidence-v1.json"
          bash scripts/validate-lv2-plugin.sh "$bundle" "$validation" >/dev/null
          bash scripts/test-lv2-jalv-host.sh "$bundle" "$jalv" >/dev/null
          bash scripts/test-lv2-ardour-host.sh "$bundle" "$ardour" >/dev/null
          python3 scripts/generate-lv2-host-evidence.py \
            --tag v9.8.7 \
            --commit "$(git rev-parse HEAD)" \
            --repository "$GITHUB_REPOSITORY" \
            --validation-report "$validation" \
            --jalv-report "$jalv" \
            --ardour-report "$ardour" \
            --output "$evidence"
          python3 - "$evidence" <<'PY'
          import json
          from pathlib import Path
          import sys
          from jsonschema import Draft202012Validator
          schema = json.loads(Path("schemas/denoize-lv2-host-evidence-v1.schema.json").read_text())
          document = json.loads(Path(sys.argv[1]).read_text())
          Draft202012Validator(schema).validate(document)
          PY

      - name: Test LV2 release archive layout
        run: |
          output_dir=$(mktemp -d /tmp/denoize-lv2-package.XXXXXX)
          bash scripts/package-lv2-plugin.sh \
            x86_64-unknown-linux-gnu v9.8.7 "$output_dir"
          archive="$output_dir/denoize-lv2-v9.8.7-x86_64-unknown-linux-gnu.tar.gz"
          tar -tzf "$archive" \
            | grep -F 'denoize.lv2/denoize.so' >/dev/null
          tar -tzf "$archive" \
            | grep -F 'denoize.lv2/denoize-models/gtcrn-dns3/gtcrn_simple.onnx' >/dev/null

  auv3-plugin:
    name: AUv3 plug-in
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Select minimum supported Rust
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0
          rustup target add aarch64-apple-darwin

      - name: Install pinned JSON Schema validator
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/denoize-python"
          "$RUNNER_TEMP/denoize-python/bin/python" -m pip install \
            --disable-pip-version-check 'jsonschema==4.25.1'
          echo "$RUNNER_TEMP/denoize-python/bin" >> "$GITHUB_PATH"

      - name: Install pinned neural model
        shell: bash
        env:
          DENOIZE_MODEL_DIR: ${{ runner.temp }}/denoize-auv3-models-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          cargo run --locked --release --no-default-features --features gtcrn --bin denoize -- \
            models install gtcrn

      - name: Build signed AUv3 containing app
        shell: bash
        env:
          DENOIZE_MODEL_DIR: ${{ runner.temp }}/denoize-auv3-models-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/build-auv3-plugin.sh aarch64-apple-darwin

      - name: Validate both Audio Units in official and real hosts
        shell: bash
        run: |
          app='target/auv3-build/aarch64-apple-darwin/Release/denoize AUv3.app'
          test -d "$app"
          report_dir="$RUNNER_TEMP/denoize-auv3-report"
          mkdir -p "$report_dir"
          auval_report="$report_dir/denoize-auv3-auval-v9.8.7-aarch64-apple-darwin.txt"
          host_report="$report_dir/denoize-auv3-host-v9.8.7-aarch64-apple-darwin.txt"
          evidence="$report_dir/denoize-auv3-host-evidence-v9.8.7-aarch64-apple-darwin.json"
          bash scripts/validate-auv3-plugin.sh "$app" "$auval_report" >/dev/null
          bash scripts/test-auv3-host.sh "$app" "$host_report" >/dev/null
          python3 scripts/generate-auv3-host-evidence.py \
            --tag v9.8.7 \
            --commit "$(git rev-parse HEAD)" \
            --repository "$GITHUB_REPOSITORY" \
            --auval-report "$auval_report" \
            --host-report "$host_report" \
            --output "$evidence"
          python3 - "$evidence" <<'PY'
          import json
          from pathlib import Path
          import sys
          from jsonschema import Draft202012Validator
          schema = json.loads(Path("schemas/denoize-auv3-host-evidence-v1.schema.json").read_text())
          document = json.loads(Path(sys.argv[1]).read_text())
          Draft202012Validator(schema).validate(document)
          PY

      - name: Test AUv3 release archive layout
        shell: bash
        run: |
          app='target/auv3-build/aarch64-apple-darwin/Release/denoize AUv3.app'
          test -d "$app"
          output_dir=$(mktemp -d "$RUNNER_TEMP/denoize-auv3-package.XXXXXX")
          archive=$(bash scripts/package-auv3-plugin.sh \
            aarch64-apple-darwin v9.8.7 "$output_dir" "$app")
          package=denoize-auv3-v9.8.7-aarch64-apple-darwin
          tar -tzf "$archive" \
            | grep -Fx "$package/denoize AUv3.app/Contents/PlugIns/denoize.appex/Contents/PlugIns/denoize.clap/Contents/Resources/denoize-models/gtcrn-dns3/gtcrn_simple.onnx"
          tar -tzf "$archive" \
            | grep -F "$package/denoize AUv3.app/Contents/PlugIns/denoize.appex/Contents/PlugIns/denoize.clap/Contents/Resources/denoize-models/gtcrn-dns3/.provenance/" >/dev/null

  sdk-native:
    name: Native C SDK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Select minimum supported Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0
          rustup target add x86_64-unknown-linux-gnu
          rustup component add clippy --toolchain 1.96.0

      - name: Install SDK contract dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends python3-jsonschema

      - name: Test frozen ABI and old-header compatibility
        run: |
          cargo test --locked -p denoize-c
          cargo clippy --locked -p denoize-c --all-targets --no-deps -- -D warnings
          bash scripts/test-c-sdk.sh
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -I sdk/denoize-c/include -fsyntax-only \
            sdk/denoize-c/tests/current_header_compile.cpp

      - name: Test native SDK release archive
        run: |
          output_dir=$(mktemp -d /tmp/denoize-c-sdk-package.XXXXXX)
          archive=$(bash scripts/package-c-sdk.sh \
            x86_64-unknown-linux-gnu "$output_dir")
          package="denoize-c-sdk-v$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)-x86_64-unknown-linux-gnu"
          tar -tzf "$archive" | grep -Fx "$package/include/denoize.h"
          tar -tzf "$archive" | grep -Fx "$package/lib/libdenoize_c.so"
          tar -tzf "$archive" | grep -Fx "$package/lib/libdenoize_c.a"

  sdk-web:
    name: WASM and Web Audio SDK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Select minimum supported Rust and WASM target
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0
          rustup target add wasm32-unknown-unknown
          rustup component add clippy --toolchain 1.96.0

      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --locked --version 0.2.126

      - name: Install pinned browser matrix
        run: |
          npm --prefix sdk/web ci
          npm --prefix sdk/web exec -- playwright install --with-deps chromium firefox webkit

      - name: Test scalar WASM and non-blocking Web Audio transport
        run: |
          cargo test --locked -p denoize-wasm
          cargo clippy --locked -p denoize-wasm --lib --no-deps -- -D warnings
          bash scripts/test-wasm-sdk.sh
          bash scripts/test-browser-sdk.sh

      - name: Test Web SDK release archive
        run: |
          output_dir=$(mktemp -d /tmp/denoize-web-sdk-package.XXXXXX)
          archive=$(bash scripts/package-web-sdk.sh "$output_dir")
          package="denoize-web-sdk-v$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          tar -tzf "$archive" | grep -Fx "$package/denoize-wasm/pkg/denoize_wasm_bg.wasm"
          tar -tzf "$archive" | grep -Fx "$package/web/src/denoize-worklet.js"
          tar -tzf "$archive" | grep -Fx "$package/web/src/denoize-worker.js"

  sdk-abi-sanitizer:
    name: C SDK AddressSanitizer fuzz regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pinned nightly Rust and cargo-fuzz
        run: |
          rustup toolchain install nightly-2026-08-20 --profile minimal --no-self-update
          cargo install cargo-fuzz --locked --version 0.13.2

      - name: Replay bounded ABI and lifecycle mutations under AddressSanitizer
        run: >-
          cargo +nightly-2026-08-20 fuzz run sdk_abi fuzz/corpus/sdk_abi --
          -runs=4096
          -max_len=4096
          -rss_limit_mb=768
          -timeout=10

  sdk-android:
    name: Android SDK (arm64-v8a and x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Select minimum supported Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0

      - name: Select Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android command-line tools
        uses: android-actions/setup-android@v4

      - name: Install pinned Android platform and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Select Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Permit the emulator to use KVM
        run: sudo chmod 666 /dev/kvm

      - name: Test on an Android x86_64 emulator and inspect the AAR
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: DENOIZE_ANDROID_RUN_INSTRUMENTATION=1 bash scripts/package-android-sdk.sh "$RUNNER_TEMP"

      - name: Inspect Android SDK archive
        shell: bash
        run: |
          version=$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)
          archive="$RUNNER_TEMP/denoize-android-sdk-v${version}.tar.gz"
          package="denoize-android-sdk-v${version}"
          tar -tzf "$archive" | grep -F "$package/denoize-sdk-" >/dev/null

  sdk-ios:
    name: iOS SDK (device and simulator)
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Select minimum supported Rust
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0

      - name: Build and test Swift package and XCFramework
        shell: bash
        run: |
          DENOIZE_IOS_RUN_SIMULATOR_TESTS=1 bash scripts/package-ios-sdk.sh "$RUNNER_TEMP"
          version=$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)
          archive="$RUNNER_TEMP/denoize-ios-sdk-v${version}.tar.gz"
          package="denoize-ios-sdk-v${version}"
          tar -tzf "$archive" | grep -F "$package/DenoizeC.xcframework/" >/dev/null
          tar -tzf "$archive" | grep -Fx "$package/Package.swift"

  cli-docs:
    name: CLI documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Select minimum supported Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0

      - name: Verify generated CLI reference
        run: bash scripts/generate-cli-docs.sh --check

  desktop:
    name: Desktop app
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Select minimum supported Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libasound2-dev xvfb

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Test accessibility in a real WebView
        working-directory: apps/desktop
        run: npm run test:a11y:webview

      - name: Audit frontend dependencies
        working-directory: apps/desktop
        run: npm audit --audit-level=moderate

      - name: Test desktop command layer
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --no-default-features --features live

  desktop-packaging:
    name: Desktop packages (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libasound2-dev libayatana-appindicator3-dev

      - name: Select stable Rust
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: Test Windows output commit paths
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo test --locked --no-default-features --lib atomic_output::tests
          cargo test --locked --no-default-features --test cli_output_commit
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --no-default-features --features live --lib

      - name: Test macOS output commit paths
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cargo test --locked --no-default-features --lib atomic_output::tests
          cargo test --locked --no-default-features --test cli_output_commit

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build desktop bundles
        working-directory: apps/desktop
        shell: bash
        run: >-
          npm run tauri -- build --ci --no-sign
          --target "${{ matrix.target }}"
          --bundles "${{ matrix.bundles }}"
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
