  desktop-build:
    name: Desktop ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out tagged source
        # actions/checkout v6.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libasound2-dev libayatana-appindicator3-dev

      - name: Select release Rust
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0
          rustup target add "${{ matrix.target }}"

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build and upload desktop bundles
        # tauri-apps/tauri-action v1.
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: denoize ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          # A single updater-metadata job assembles latest.json after all four
          # platform jobs finish. Matrix jobs must not race on that shared name.
          uploadUpdaterJson: false
          updaterJsonPreferNsis: true
          retryAttempts: 3
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

  updater-metadata:
    name: Assemble updater metadata
    needs: desktop-build
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        # actions/checkout v6.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Assemble and upload updater metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset_dir=$(mktemp -d /tmp/denoize-updater.XXXXXX)
          assets_json="$asset_dir/release-assets.json"
          metadata="$asset_dir/latest.json"
          gh release view "$GITHUB_REF_NAME" --json assets > "$assets_json"
          gh release download "$GITHUB_REF_NAME" \
            --pattern "denoize_${GITHUB_REF_NAME#v}_aarch64.app.tar.gz.sig" \
            --pattern "denoize_${GITHUB_REF_NAME#v}_x64.app.tar.gz.sig" \
            --pattern "denoize_${GITHUB_REF_NAME#v}_amd64.AppImage.sig" \
            --pattern "denoize_${GITHUB_REF_NAME#v}_amd64.deb.sig" \
            --pattern "denoize_${GITHUB_REF_NAME#v}_x64-setup.exe.sig" \
            --pattern "denoize_${GITHUB_REF_NAME#v}_x64_en-US.msi.sig" \
            --dir "$asset_dir"
          python3 scripts/assemble-release-updater-metadata.py \
            --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --assets-json "$assets_json" \
            --signature-dir "$asset_dir" \
            --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output "$metadata"
          gh release upload "$GITHUB_REF_NAME" "$metadata" --clobber

