          matrix="$RUNNER_TEMP/denoize-vst3-host-matrix-v1.json"
          bash scripts/validate-vst3-plugin.sh "$bundle" "$report" >/dev/null
          bash scripts/test-vst3-ardour-host.sh "$bundle" "$host_report" >/dev/null
          python3 scripts/generate-vst3-host-matrix.py \
            --tag "$GITHUB_REF_NAME" \
            --commit "$(git rev-parse HEAD)" \
            --repository "$GITHUB_REPOSITORY" \
            --operating-system ubuntu-24.04 \
            --architecture x86_64 \
            --validator-report "$report" \
            --real-host-report "$host_report" \
            --output "$matrix"
          python3 - "$matrix" <<'PY'
          import json
          from pathlib import Path
          import sys
          from jsonschema import Draft202012Validator
          schema = json.loads(Path("schemas/denoize-plugin-host-matrix-v1.schema.json").read_text())
          document = json.loads(Path(sys.argv[1]).read_text())
          Draft202012Validator(schema).validate(document)
          PY

      - name: Attest signed VST3 host matrix and reports
        if: runner.os == 'Linux'
        id: attest-vst3-host-matrix
        # actions/attest v4.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            ${{ runner.temp }}/denoize-vst3-host-matrix-v1.json
            ${{ runner.temp }}/denoize-vst3-validator-${{ github.ref_name }}-${{ matrix.target }}.txt
            ${{ runner.temp }}/denoize-vst3-ardour-${{ github.ref_name }}-${{ matrix.target }}.txt

      - name: Package VST3 plug-in
        shell: bash
        run: |
          bash scripts/package-vst3-plugin.sh \
            "${{ matrix.target }}" "$GITHUB_REF_NAME" .
          archive="denoize-vst3-${GITHUB_REF_NAME}-${{ matrix.target }}.${{ matrix.archive }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi

      - name: Upload VST3 release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            denoize-vst3-${GITHUB_REF_NAME}-${{ matrix.target }}.${{ matrix.archive }} \
            denoize-vst3-${GITHUB_REF_NAME}-${{ matrix.target }}.${{ matrix.archive }}.sha256 \
            --clobber

      - name: Upload signed VST3 host evidence
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          provenance="$RUNNER_TEMP/denoize-vst3-host-matrix-v1.sigstore.json"
          cp "${{ steps.attest-vst3-host-matrix.outputs.bundle-path }}" "$provenance"
          gh release upload "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/denoize-vst3-host-matrix-v1.json" \
            "$RUNNER_TEMP/denoize-vst3-validator-${GITHUB_REF_NAME}-${{ matrix.target }}.txt" \
            "$RUNNER_TEMP/denoize-vst3-ardour-${GITHUB_REF_NAME}-${{ matrix.target }}.txt" \
            "$provenance" \
            --clobber

