name: GitHub Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate tag and create draft
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        # actions/checkout v6.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Validate release provenance and versions
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          tag_commit=$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")
          git fetch --no-tags origin \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor \
            "$tag_commit" "refs/remotes/origin/${DEFAULT_BRANCH}"; then
            echo "Tag $GITHUB_REF_NAME commit $tag_commit is not on origin/${DEFAULT_BRANCH}" >&2
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME commit $tag_commit is on origin/${DEFAULT_BRANCH}"
          bash scripts/verify-release-version.sh "$GITHUB_REF_NAME"

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Install live audio development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libasound2-dev python3-jsonschema

      - name: Audit Rust dependency locks
        run: |
          cargo audit --file Cargo.lock
          cargo audit --file apps/desktop/src-tauri/Cargo.lock
          cargo audit --file fuzz/Cargo.lock
          bash scripts/publish-crates-io.sh --audit

      - name: Audit frontend dependency lock
        working-directory: apps/desktop
        run: npm audit --package-lock-only --audit-level=moderate

      - name: Run release tests
        run: cargo test --locked --all-targets --features full

      - name: Validate project JSON contracts
        run: python3 scripts/test-project-schemas.py --denoize target/debug/denoize

      - name: Validate runtime model package JSON contracts
        run: python3 scripts/test-runtime-model-package-schemas.py

      - name: Validate native diagnostic JSON contracts
        run: python3 scripts/test-diagnostic-schemas.py --denoize target/debug/denoize

      - name: Validate deterministic restoration JSON contracts
        run: python3 scripts/test-restoration-schemas.py

      - name: Validate universal restoration JSON contracts
        run: python3 scripts/test-universal-restoration-schemas.py

      - name: Validate neural DAW JSON contracts
        run: python3 scripts/test-neural-daw-schemas.py --denoize target/debug/denoize

      - name: Validate DPDFNet promotion evidence contracts
        run: python3 scripts/test-dpdfnet-promotion-evidence.py

      - name: Validate target-speaker JSON contracts
        run: python3 scripts/test-target-speaker-schemas.py

      - name: Validate target-sound JSON contracts
        run: python3 scripts/test-target-sound-schemas.py

      - name: Validate causal target-sound JSON contracts
        run: python3 scripts/test-causal-target-sound-schemas.py

      - name: Validate acoustic echo cancellation JSON contracts
        run: python3 scripts/test-aec-schemas.py

      - name: Validate microphone-array JSON contracts
        run: python3 scripts/test-microphone-array-schemas.py

      - name: Validate meeting speaker-track JSON contracts
        run: python3 scripts/test-meeting-speaker-schemas.py

      - name: Validate music-restoration JSON contracts
        run: python3 scripts/test-music-restoration-schemas.py

      - name: Validate DeepFilterNet speech quality
        run: |
          cargo build --locked --features full --bin denoize
          python3 scripts/validate-deepfilter.py --denoize target/debug/denoize

      - name: Verify generated CLI reference
        run: |
          # The release test matrix builds the full-featured CLI. Rebuild the
          # documented no-default binary so the check is independent of the
          # preceding test targets.
          cargo build --locked --no-default-features --bin denoize
          bash scripts/generate-cli-docs.sh --check

      - name: Verify release evidence tooling
        run: |
          bash -n \
            scripts/build-auv3-plugin.sh \
            scripts/build-lv2-plugin.sh \
            scripts/build-vst3-plugin.sh \
            scripts/package-android-sdk.sh \
            scripts/package-auv3-plugin.sh \
            scripts/package-c-sdk.sh \
            scripts/package-clap-plugin.sh \
            scripts/package-dpdfnet-experimental-clap.sh \
            scripts/package-ios-sdk.sh \
            scripts/package-lv2-plugin.sh \
            scripts/package-vst3-plugin.sh \
            scripts/package-web-sdk.sh \
            scripts/package-release-evidence.sh \
            scripts/publish-crates-io.sh \
            scripts/release-evidence-assets.sh \
            scripts/test-evaluation-evidence.sh \
            scripts/test-lv2-ardour-host.sh \
            scripts/test-lv2-jalv-host.sh \
            scripts/test-resilience.sh \
            scripts/test-release-evidence.sh \
            scripts/test-c-sdk.sh \
            scripts/test-auv3-host.sh \
            scripts/test-wasm-sdk.sh \
            scripts/test-vst3-ardour-host.sh \
            scripts/verify-release-assets.sh \
            scripts/verify-release-evidence.sh \
            scripts/validate-auv3-plugin.sh \
            scripts/validate-lv2-plugin.sh \
            scripts/validate-vst3-plugin.sh
          python3 -c 'compile(open("scripts/generate-auv3-host-evidence.py", encoding="utf-8").read(), "scripts/generate-auv3-host-evidence.py", "exec")'
          python3 -c 'compile(open("scripts/generate-lv2-host-evidence.py", encoding="utf-8").read(), "scripts/generate-lv2-host-evidence.py", "exec")'
          python3 -c 'compile(open("scripts/generate-release-evidence.py", encoding="utf-8").read(), "scripts/generate-release-evidence.py", "exec")'
          python3 -c 'compile(open("scripts/assemble-release-updater-metadata.py", encoding="utf-8").read(), "scripts/assemble-release-updater-metadata.py", "exec")'
          python3 -c 'compile(open("scripts/assemble-application-update.py", encoding="utf-8").read(), "scripts/assemble-application-update.py", "exec")'
          python3 -c 'compile(open("scripts/test-application-update-manifest.py", encoding="utf-8").read(), "scripts/test-application-update-manifest.py", "exec")'
          python3 -c 'compile(open("scripts/test-diagnostic-schemas.py", encoding="utf-8").read(), "scripts/test-diagnostic-schemas.py", "exec")'
          python3 -c 'compile(open("scripts/test-project-schemas.py", encoding="utf-8").read(), "scripts/test-project-schemas.py", "exec")'
          python3 -c 'compile(open("scripts/test-restoration-schemas.py", encoding="utf-8").read(), "scripts/test-restoration-schemas.py", "exec")'
          python3 -c 'compile(open("scripts/test-universal-restoration-schemas.py", encoding="utf-8").read(), "scripts/test-universal-restoration-schemas.py", "exec")'
          python3 -c 'compile(open("scripts/test-neural-daw-schemas.py", encoding="utf-8").read(), "scripts/test-neural-daw-schemas.py", "exec")'
          python3 -c 'compile(open("scripts/prepare-dpdfnet-blind-listening.py", encoding="utf-8").read(), "scripts/prepare-dpdfnet-blind-listening.py", "exec")'
          python3 -c 'compile(open("scripts/recover-dpdfnet-blind-answer-key.py", encoding="utf-8").read(), "scripts/recover-dpdfnet-blind-answer-key.py", "exec")'
          python3 -c 'compile(open("scripts/score-dpdfnet-blind-listening.py", encoding="utf-8").read(), "scripts/score-dpdfnet-blind-listening.py", "exec")'
          python3 -c 'compile(open("scripts/generate-dpdfnet-platform-evidence.py", encoding="utf-8").read(), "scripts/generate-dpdfnet-platform-evidence.py", "exec")'
          python3 -c 'compile(open("scripts/generate-dpdfnet-promotion-evidence.py", encoding="utf-8").read(), "scripts/generate-dpdfnet-promotion-evidence.py", "exec")'
          python3 -c 'compile(open("scripts/verify-dpdfnet-objective-equivalence.py", encoding="utf-8").read(), "scripts/verify-dpdfnet-objective-equivalence.py", "exec")'
          python3 -c 'compile(open("scripts/fetch-dpdfnet-reporter-evidence.py", encoding="utf-8").read(), "scripts/fetch-dpdfnet-reporter-evidence.py", "exec")'
          python3 -c 'compile(open("scripts/test-dpdfnet-promotion-evidence.py", encoding="utf-8").read(), "scripts/test-dpdfnet-promotion-evidence.py", "exec")'
          python3 -c 'compile(open("scripts/test-target-speaker-schemas.py", encoding="utf-8").read(), "scripts/test-target-speaker-schemas.py", "exec")'
          python3 -c 'compile(open("scripts/test-target-sound-schemas.py", encoding="utf-8").read(), "scripts/test-target-sound-schemas.py", "exec")'
          python3 -c 'compile(open("scripts/test-causal-target-sound-schemas.py", encoding="utf-8").read(), "scripts/test-causal-target-sound-schemas.py", "exec")'
          python3 -c 'compile(open("scripts/test-aec-schemas.py", encoding="utf-8").read(), "scripts/test-aec-schemas.py", "exec")'
          python3 -c 'compile(open("scripts/test-microphone-array-schemas.py", encoding="utf-8").read(), "scripts/test-microphone-array-schemas.py", "exec")'
          python3 -c 'compile(open("scripts/test-meeting-speaker-schemas.py", encoding="utf-8").read(), "scripts/test-meeting-speaker-schemas.py", "exec")'
          python3 -c 'compile(open("scripts/test-music-restoration-schemas.py", encoding="utf-8").read(), "scripts/test-music-restoration-schemas.py", "exec")'
          python3 -c 'compile(open("scripts/generate-vst3-host-matrix.py", encoding="utf-8").read(), "scripts/generate-vst3-host-matrix.py", "exec")'
          python3 -c 'compile(open("scripts/test-vst3-host-matrix.py", encoding="utf-8").read(), "scripts/test-vst3-host-matrix.py", "exec")'
          python3 -c 'compile(open("scripts/test-lv2-host-evidence.py", encoding="utf-8").read(), "scripts/test-lv2-host-evidence.py", "exec")'
          python3 -c 'compile(open("scripts/test-auv3-host-evidence.py", encoding="utf-8").read(), "scripts/test-auv3-host-evidence.py", "exec")'
          python3 -c 'compile(open("scripts/test-runtime-model-package-schemas.py", encoding="utf-8").read(), "scripts/test-runtime-model-package-schemas.py", "exec")'
          python3 -c 'compile(open("scripts/test-release-updater-metadata.py", encoding="utf-8").read(), "scripts/test-release-updater-metadata.py", "exec")'
          python3 -c 'compile(open("scripts/test-sdk-contracts.py", encoding="utf-8").read(), "scripts/test-sdk-contracts.py", "exec")'
          for schema in schemas/*.schema.json; do
            jq -e '."$schema" == "https://json-schema.org/draft/2020-12/schema"' \
              "$schema" >/dev/null
          done
          python3 scripts/test-release-updater-metadata.py
          python3 scripts/test-application-update-manifest.py
          python3 scripts/test-vst3-host-matrix.py
          python3 scripts/test-lv2-host-evidence.py
          python3 scripts/test-auv3-host-evidence.py
          python3 scripts/test-dpdfnet-promotion-evidence.py
          python3 scripts/test-sdk-contracts.py
          DENOIZE_BIN=target/debug/denoize bash scripts/test-evaluation-evidence.sh
          bash scripts/test-release-evidence.sh

      - name: Verify crates.io package
        run: |
          bash scripts/publish-crates-io.sh --test
          bash scripts/publish-crates-io.sh --dry-run

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; reusing it."
          else
            release_args=(
              --draft
              --verify-tag
              --generate-notes
              --title "denoize $GITHUB_REF_NAME"
            )
            notes_file="docs/releases/${GITHUB_REF_NAME}.md"
            if [[ -f "$notes_file" ]]; then
              echo "Prepending curated release notes from $notes_file."
              release_args+=(--notes-file "$notes_file")
            fi
            gh release create "$GITHUB_REF_NAME" "${release_args[@]}"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out tagged source
        # actions/checkout v6.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Select release Rust
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0

      - name: Install live audio development dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libasound2-dev

      - name: Enable legacy CMake policy compatibility (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          real_cmake=$(command -v cmake)
          wrapper="$RUNNER_TEMP/denoize-cmake"
          cat > "$wrapper" <<EOF
          #!/usr/bin/env bash
          case "\${1:-}" in
            --build|--install|--open|--help|--version|-E)
              exec "$real_cmake" "\$@"
              ;;
            *)
              exec "$real_cmake" "\$@" -DCMAKE_POLICY_VERSION_MINIMUM=3.5
              ;;
          esac
          EOF
          chmod +x "$wrapper"
          echo "CMAKE=$wrapper" >> "$GITHUB_ENV"

      - name: Enable legacy CMake policy compatibility (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wrapper = Join-Path $env:RUNNER_TEMP "denoize-cmake.cmd"
          @'
          @echo off
          if /I "%~1"=="--build" goto passthrough
          if /I "%~1"=="--install" goto passthrough
          cmake.exe %* -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          exit /b %errorlevel%
          :passthrough
          cmake.exe %*
          '@ | Set-Content -Encoding ascii $wrapper
          "CMAKE=$wrapper" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build release binary
        run: cargo build --locked --release --features full

      - name: Build and package stable C SDK
        shell: bash
        run: bash scripts/package-c-sdk.sh "${{ matrix.target }}" .

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          package="denoize-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$package"
          cp target/release/denoize README.md LICENSE THIRD_PARTY.md "$package/"
          cp -R LICENSES "$package/"
          tar -czf "$package.tar.gz" "$package"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$package.tar.gz" > "$package.tar.gz.sha256"
          else
            shasum -a 256 "$package.tar.gz" > "$package.tar.gz.sha256"
          fi

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "denoize-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $package | Out-Null
          Copy-Item target/release/denoize.exe, README.md, LICENSE, THIRD_PARTY.md -Destination $package
          Copy-Item LICENSES -Destination "$package/LICENSES" -Recurse
          Compress-Archive -Path $package -DestinationPath "$package.zip"
          $hash = (Get-FileHash "$package.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $package.zip" | Set-Content -Encoding ascii "$package.zip.sha256"

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            denoize-${GITHUB_REF_NAME}-${{ matrix.target }}.${{ matrix.archive }} \
            denoize-${GITHUB_REF_NAME}-${{ matrix.target }}.${{ matrix.archive }}.sha256 \
            denoize-c-sdk-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz \
            denoize-c-sdk-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz.sha256 \
            --clobber

  sdk-web-build:
    name: Web and WASM SDK
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Select release Rust and WASM target
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0
          rustup target add wasm32-unknown-unknown

      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --locked --version 0.2.126

      - name: Install pinned browser matrix
        run: |
          npm --prefix sdk/web ci
          npm --prefix sdk/web exec -- playwright install --with-deps chromium firefox webkit

      - name: Test and package Web SDK
        run: |
          bash scripts/test-wasm-sdk.sh
          bash scripts/test-browser-sdk.sh
          bash scripts/package-web-sdk.sh "$RUNNER_TEMP"

      - name: Upload Web SDK assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/denoize-web-sdk-${GITHUB_REF_NAME}.tar.gz" \
            "$RUNNER_TEMP/denoize-web-sdk-${GITHUB_REF_NAME}.tar.gz.sha256" \
            --clobber

  sdk-android-build:
    name: Android SDK
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Select release Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0

      - name: Select Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android command-line tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Install pinned Android platform and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Select Gradle 9.5
        uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37
        with:
          gradle-version: "9.5.0"

      - name: Permit the emulator to use KVM
        run: sudo chmod 666 /dev/kvm

      - name: Test and package Android SDK on an x86_64 emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: DENOIZE_ANDROID_RUN_INSTRUMENTATION=1 bash scripts/package-android-sdk.sh "$RUNNER_TEMP"

      - name: Upload Android SDK assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/denoize-android-sdk-${GITHUB_REF_NAME}.tar.gz" \
            "$RUNNER_TEMP/denoize-android-sdk-${GITHUB_REF_NAME}.tar.gz.sha256" \
            --clobber

  sdk-abi-sanitizer-build:
    name: C SDK AddressSanitizer fuzz regression
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install pinned nightly Rust and cargo-fuzz
        run: |
          rustup toolchain install nightly-2026-08-20 --profile minimal --no-self-update
          cargo install cargo-fuzz --locked --version 0.13.2

      - name: Replay bounded ABI and lifecycle mutations under AddressSanitizer
        run: >-
          cargo +nightly-2026-08-20 fuzz run sdk_abi fuzz/corpus/sdk_abi --
          -runs=4096
          -max_len=4096
          -rss_limit_mb=768
          -timeout=10

  sdk-ios-build:
    name: iOS SDK
    needs: prepare
    runs-on: macos-14
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Select release Rust
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0

      - name: Build and test iOS SDK
        shell: bash
        run: DENOIZE_IOS_RUN_SIMULATOR_TESTS=1 bash scripts/package-ios-sdk.sh "$RUNNER_TEMP"

      - name: Upload iOS SDK assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/denoize-ios-sdk-${GITHUB_REF_NAME}.tar.gz" \
            "$RUNNER_TEMP/denoize-ios-sdk-${GITHUB_REF_NAME}.tar.gz.sha256" \
            --clobber

  plugin-build:
    name: CLAP ${{ matrix.target }}
    needs: prepare
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out tagged source
        # actions/checkout v6.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install embedded-editor host dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            dbus-x11 libxtst6 python3-jsonschema xvfb

      - name: Select release Rust
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0
          rustup target add "${{ matrix.target }}"

      - name: Build release CLAP plug-in
        shell: bash
        run: cargo build --locked --release --target "${{ matrix.target }}" -p denoize-clap

      - name: Install pinned neural model for validation
        if: runner.os == 'Linux'
        shell: bash
        env:
          DENOIZE_MODEL_DIR: /tmp/denoize-clap-models-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          cargo run --locked --release --no-default-features --features gtcrn --bin denoize -- \
            models install gtcrn

      - name: Exercise pinned neural model on the permanent worker
        if: runner.os == 'Linux'
        shell: bash
        env:
          DENOIZE_MODEL_DIR: /tmp/denoize-clap-models-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          cargo test --locked --release -p denoize-clap \
            neural::tests::pinned_gtcrn_release_worker_meets_sustained_deadlines -- --ignored --exact

      - name: Validate tagged plug-in with official CLAP validator
        if: runner.os == 'Linux'
        shell: bash
        env:
          DENOIZE_MODEL_DIR: /tmp/denoize-clap-models-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          validator_dir=$(mktemp -d /tmp/denoize-clap-validator.XXXXXX)
          validator_zip="$validator_dir/clap-validator.zip"
          curl --fail --location --silent --show-error \
            https://github.com/free-audio/clap-validator/releases/download/0.4.1/clap-validator-0.4.1-127-g152b982-ubuntu-22.04.zip \
            --output "$validator_zip"
          echo "49edadcfb407ea0dd946ce418300e853fbd2660fa4b0d00e4f19ff8eef24ad90  $validator_zip" \
            | sha256sum --check
          unzip -q "$validator_zip" -d "$validator_dir"
          tar -xzf "$validator_dir"/*.tar.gz -C "$validator_dir"
          validator=$(find "$validator_dir" -type f -name clap-validator -perm -u+x -print -quit)
          test -n "$validator"
          cp target/${{ matrix.target }}/release/libdenoize_clap.so \
            "$validator_dir/denoize.clap"
          validator_status=1
          report_status=1
          for attempt in 1 2; do
            set +e
            "$validator" --verbosity quiet validate --json "$validator_dir/denoize.clap" \
              > "$validator_dir/report.json"
            validator_status=$?
            if [ "$validator_status" -eq 0 ]; then
              jq -e '
                (.results | length) == 81 and
                ([.results[].status.code] | map(select(. == "success")) | length) == 68 and
                ([.results[].status.code] | map(select(. == "skipped")) | length) == 13 and
                ([.results[].status.code] | all(. == "success" or . == "skipped"))
              ' "$validator_dir/report.json" >/dev/null
              report_status=$?
            else
              report_status=1
            fi
            set -e
            if [ "$validator_status" -eq 0 ] && [ "$report_status" -eq 0 ]; then
              break
            fi
            printf 'CLAP validator attempt %s failed: validator status %s, report contract status %s\n' \
              "$attempt" "$validator_status" "$report_status" >&2
          done
          if [ "$validator_status" -ne 0 ] || [ "$report_status" -ne 0 ]; then
            if jq -e . "$validator_dir/report.json" >/dev/null 2>&1; then
              jq . "$validator_dir/report.json" >&2
            else
              sed -n '1,200p' "$validator_dir/report.json" >&2
            fi
            exit 1
          fi
          for rate in 44100 48000 96000; do
            cargo run --locked --release --no-default-features --bin denoize -- \
              plugin latency --sample-rate "$rate" --json \
              | jq -e '.matches_reported == true and .latency_frames == .measured_latency_frames' \
                >/dev/null
          done
          for rate in 44100 44100.5 48000 96000; do
            cargo run --locked --release --no-default-features --bin denoize -- \
              plugin neural latency --sample-rate "$rate" --json \
              | jq -e '.matches_reported == true and .latency_frames == .measured_latency_frames' \
                >/dev/null
          done

      - name: Validate and bind embedded-editor host evidence
        if: runner.os == 'Linux'
        shell: bash
        run: |
          report="$RUNNER_TEMP/denoize-clap-editor-host-${GITHUB_REF_NAME}-${{ matrix.target }}.txt"
          evidence="$RUNNER_TEMP/denoize-plugin-editor-evidence-v1.json"
          bash scripts/test-clap-editor-host.sh \
            target/${{ matrix.target }}/release/libdenoize_clap.so "$report" >/dev/null
          python3 scripts/generate-plugin-editor-evidence.py \
            --tag "$GITHUB_REF_NAME" \
            --commit "$(git rev-parse HEAD)" \
            --repository "$GITHUB_REPOSITORY" \
            --operating-system ubuntu-24.04 \
            --architecture x86_64 \
            --report "$report" \
            --output "$evidence"
          python3 - "$evidence" <<'PY'
          import json
          from pathlib import Path
          import sys
          from jsonschema import Draft202012Validator
          schema = json.loads(Path("schemas/denoize-plugin-editor-evidence-v1.schema.json").read_text())
          document = json.loads(Path(sys.argv[1]).read_text())
          Draft202012Validator(schema).validate(document)
          PY

      - name: Attest embedded-editor host evidence
        if: runner.os == 'Linux'
        id: attest-plugin-editor
        # actions/attest v4.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            ${{ runner.temp }}/denoize-plugin-editor-evidence-v1.json
            ${{ runner.temp }}/denoize-clap-editor-host-${{ github.ref_name }}-${{ matrix.target }}.txt

      - name: Package CLAP plug-in
        shell: bash
        run: |
          bash scripts/package-clap-plugin.sh \
            "${{ matrix.target }}" "$GITHUB_REF_NAME" .
          archive="denoize-plugin-${GITHUB_REF_NAME}-${{ matrix.target }}.${{ matrix.archive }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi

      - name: Upload CLAP release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            denoize-plugin-${GITHUB_REF_NAME}-${{ matrix.target }}.${{ matrix.archive }} \
            denoize-plugin-${GITHUB_REF_NAME}-${{ matrix.target }}.${{ matrix.archive }}.sha256 \
            --clobber

      - name: Upload signed embedded-editor host evidence
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          provenance="$RUNNER_TEMP/denoize-plugin-editor-evidence-v1.sigstore.json"
          cp "${{ steps.attest-plugin-editor.outputs.bundle-path }}" "$provenance"
          gh release upload "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/denoize-plugin-editor-evidence-v1.json" \
            "$RUNNER_TEMP/denoize-clap-editor-host-${GITHUB_REF_NAME}-${{ matrix.target }}.txt" \
            "$provenance" \
            --clobber

  vst3-build:
    name: VST3 ${{ matrix.target }}
    needs: prepare
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out tagged source
        # actions/checkout v6.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Select release Rust
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0
          rustup target add "${{ matrix.target }}"

      - name: Install Linux validation dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            ardour=1:8.4.0+ds1-2ubuntu8 \
            libasound2-dev \
            python3-jsonschema

      - name: Build statically bound VST3 bundle
        shell: bash
        run: bash scripts/build-vst3-plugin.sh "${{ matrix.target }}"

      - name: Install pinned neural model for validation
        if: runner.os == 'Linux'
        shell: bash
        env:
          DENOIZE_MODEL_DIR: /tmp/denoize-vst3-models-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          cargo run --locked --release --no-default-features --features gtcrn --bin denoize -- \
            models install gtcrn

      - name: Validate and bind VST3 host evidence
        if: runner.os == 'Linux'
        shell: bash
        env:
          DENOIZE_MODEL_DIR: /tmp/denoize-vst3-models-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          bundle=target/vst3-build/${{ matrix.target }}/Release/denoize.vst3
