  release-evidence:
    name: Generate release SBOMs and provenance
    needs: [build, sdk-web-build, sdk-android-build, sdk-abi-sanitizer-build, sdk-ios-build, plugin-build, vst3-build, lv2-build, auv3-build, desktop-build, model-catalog, updater-metadata]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out tagged source
        # actions/checkout v6.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Select release Rust
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0

      - name: Download installable release artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset_dir=$(mktemp -d /tmp/denoize-release-assets.XXXXXX)
          evidence_dir="$RUNNER_TEMP/denoize-release-evidence-v1"
          asset_spec="$RUNNER_TEMP/release-primary-assets.tsv"
          bash scripts/release-evidence-assets.sh primary "$GITHUB_REF_NAME" > "$asset_spec"
          while IFS=$'\t' read -r kind target name; do
            if [[ "$kind" != crate ]]; then
              gh release download "$GITHUB_REF_NAME" \
                --pattern "$name" --dir "$asset_dir"
            fi
          done < "$asset_spec"
          source_date_epoch=$(git show -s --format=%ct HEAD)
          source_commit=$(git rev-parse HEAD)
          {
            echo "DENOIZE_RELEASE_ASSET_DIR=$asset_dir"
            echo "DENOIZE_RELEASE_EVIDENCE_DIR=$evidence_dir"
            echo "DENOIZE_RELEASE_ASSET_SPEC=$asset_spec"
            echo "DENOIZE_RELEASE_SOURCE_COMMIT=$source_commit"
            echo "SOURCE_DATE_EPOCH=$source_date_epoch"
          } >> "$GITHUB_ENV"

      - name: Package exact crates.io archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          package="$DENOIZE_RELEASE_ASSET_DIR/denoize-${version}.crate"
          bash scripts/publish-crates-io.sh --package-only "$package"
          (
            cd "$DENOIZE_RELEASE_ASSET_DIR"
            sha256sum "$(basename "$package")" > "$(basename "$package").sha256"
          )
          gh release upload "$GITHUB_REF_NAME" \
            "$package" "$package.sha256" --clobber

      - name: Install pinned Syft
        id: syft
        # anchore/sbom-action v0, with the scanner itself fixed below.
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610
        with:
          syft-version: v1.50.0

      - name: Generate per-artifact CycloneDX SBOMs
        shell: bash
        run: |
          python3 scripts/generate-release-evidence.py generate \
            --tag "$GITHUB_REF_NAME" \
            --commit "$DENOIZE_RELEASE_SOURCE_COMMIT" \
            --repository "$GITHUB_REPOSITORY" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --repository-root "$GITHUB_WORKSPACE" \
            --artifact-dir "$DENOIZE_RELEASE_ASSET_DIR" \
            --asset-spec "$DENOIZE_RELEASE_ASSET_SPEC" \
            --model-catalog "$GITHUB_WORKSPACE/models/catalog-v1.json" \
            --syft "${{ steps.syft.outputs.cmd }}" \
            --syft-version 1.50.0 \
            --output-dir "$DENOIZE_RELEASE_EVIDENCE_DIR"

      - name: Attest installable release artifacts
        id: attest-subjects
        # actions/attest v4.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: ${{ runner.temp }}/denoize-release-evidence-v1/subjects.sha256

      - name: Assemble reproducible offline evidence archive
        shell: bash
        run: |
          cp scripts/verify-release-evidence.sh \
            "$DENOIZE_RELEASE_EVIDENCE_DIR/verify-release-evidence.sh"
          cp schemas/denoize-release-evidence-v1.schema.json \
            "$DENOIZE_RELEASE_EVIDENCE_DIR/denoize-release-evidence-v1.schema.json"
          cp docs/release-evidence.md "$DENOIZE_RELEASE_EVIDENCE_DIR/README.md"
          python3 scripts/generate-release-evidence.py finalize \
            --output-dir "$DENOIZE_RELEASE_EVIDENCE_DIR"
          evidence_archive="$RUNNER_TEMP/denoize-release-evidence-${GITHUB_REF_NAME}.tar.gz"
          bash scripts/package-release-evidence.sh \
            "$DENOIZE_RELEASE_EVIDENCE_DIR" \
            "$evidence_archive" \
            "$SOURCE_DATE_EPOCH"
          (
            cd "$RUNNER_TEMP"
            sha256sum "$(basename "$evidence_archive")" \
              > "$(basename "$evidence_archive").sha256"
          )
          echo "DENOIZE_RELEASE_EVIDENCE_ARCHIVE=$evidence_archive" >> "$GITHUB_ENV"

      - name: Attest offline evidence archive
        id: attest-evidence
        # actions/attest v4.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/denoize-release-evidence-${{ github.ref_name }}.tar.gz

      - name: Upload release evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          evidence_bundle="$DENOIZE_RELEASE_EVIDENCE_ARCHIVE.sigstore.json"
          subjects_bundle="$DENOIZE_RELEASE_ASSET_DIR/denoize-release-subjects-${GITHUB_REF_NAME}.sigstore.json"
          trusted_root="$DENOIZE_RELEASE_ASSET_DIR/denoize-sigstore-trusted-root.jsonl"
          cp "${{ steps.attest-evidence.outputs.bundle-path }}" "$evidence_bundle"
          cp "${{ steps.attest-subjects.outputs.bundle-path }}" "$subjects_bundle"
          gh attestation trusted-root > "$trusted_root"
          gh release upload "$GITHUB_REF_NAME" \
            "$DENOIZE_RELEASE_EVIDENCE_ARCHIVE" \
            "$DENOIZE_RELEASE_EVIDENCE_ARCHIVE.sha256" \
            "$evidence_bundle" \
            "$subjects_bundle" \
            "$trusted_root" \
            --clobber

  application-update:
    name: Build signed recoverable application updates
    needs: release-evidence
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out tagged source
        # actions/checkout v6.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Select release Rust
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0

      - name: Install Tauri signer
        working-directory: apps/desktop
        run: npm ci

      - name: Assemble signed manifest and offline rollback bundles
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          update_dir=$(mktemp -d /tmp/denoize-application-update.XXXXXX)
          candidate_dir="$update_dir/candidate"
          candidate_sbom_dir="$update_dir/candidate-sbom"
          rollback_root="$update_dir/rollback"
          mkdir -p "$candidate_dir" "$candidate_sbom_dir" "$rollback_root"
          version=${GITHUB_REF_NAME#v}
          rollback_versions=(0.86.0 0.87.0)
          desktop_names=(
            "denoize_${version}_aarch64.app.tar.gz"
            "denoize_${version}_x64.app.tar.gz"
            "denoize_${version}_amd64.AppImage"
            "denoize_${version}_amd64.deb"
            "denoize_${version}_x64-setup.exe"
            "denoize_${version}_x64_en-US.msi"
          )
          for name in "${desktop_names[@]}"; do
            gh release download "$GITHUB_REF_NAME" --pattern "$name" --dir "$candidate_dir"
          done
          current_evidence="$update_dir/denoize-release-evidence-${GITHUB_REF_NAME}.tar.gz"
          current_provenance="$update_dir/denoize-release-subjects-${GITHUB_REF_NAME}.sigstore.json"
          gh release download "$GITHUB_REF_NAME" \
            --pattern "$(basename "$current_evidence")" \
            --pattern "$(basename "$current_provenance")" \
            --dir "$update_dir"
          current_extract="$update_dir/current-evidence"
          mkdir "$current_extract"
          tar -xzf "$current_evidence" -C "$current_extract" --no-same-owner --no-same-permissions
          for name in "${desktop_names[@]}"; do
            cp "$current_extract/denoize-release-evidence-v1/sbom/${name}.cdx.json" \
              "$candidate_sbom_dir/${name}.cdx.json"
          done

          rollback_args=()
          for rollback_version in "${rollback_versions[@]}"; do
            rollback_tag="v${rollback_version}"
            rollback_dir="$rollback_root/$rollback_version"
            rollback_artifact_dir="$rollback_dir/artifacts"
            rollback_sbom_dir="$rollback_dir/sbom"
            mkdir -p "$rollback_artifact_dir" "$rollback_sbom_dir"
            rollback_names=(
              "denoize_${rollback_version}_aarch64.app.tar.gz"
              "denoize_${rollback_version}_x64.app.tar.gz"
              "denoize_${rollback_version}_amd64.AppImage"
              "denoize_${rollback_version}_amd64.deb"
              "denoize_${rollback_version}_x64-setup.exe"
              "denoize_${rollback_version}_x64_en-US.msi"
            )
            for name in "${rollback_names[@]}"; do
              gh release download "$rollback_tag" --pattern "$name" --dir "$rollback_artifact_dir"
            done
            rollback_evidence="$rollback_dir/denoize-release-evidence-${rollback_tag}.tar.gz"
            rollback_provenance="$rollback_dir/denoize-release-subjects-${rollback_tag}.sigstore.json"
            gh release download "$rollback_tag" \
              --pattern "$(basename "$rollback_evidence")" \
              --pattern "$(basename "$rollback_provenance")" \
              --dir "$rollback_dir"
            rollback_extract="$rollback_dir/evidence"
            mkdir "$rollback_extract"
            tar -xzf "$rollback_evidence" -C "$rollback_extract" --no-same-owner --no-same-permissions
            for name in "${rollback_names[@]}"; do
              cp "$rollback_extract/denoize-release-evidence-v1/sbom/${name}.cdx.json" \
                "$rollback_sbom_dir/${name}.cdx.json"
            done
            rollback_args+=(
              --rollback
              "${rollback_version}|${rollback_artifact_dir}|${rollback_sbom_dir}|${rollback_provenance}"
            )
          done

          manifest="$update_dir/denoize-update-manifest-v1.json"
          plan="$update_dir/denoize-update-bundle-build-plan-v1.json"
          python3 scripts/assemble-application-update.py \
            --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$(git rev-parse HEAD)" \
            --published-unix-seconds "$(git show -s --format=%ct HEAD)" \
            --candidate-dir "$candidate_dir" \
            --candidate-sbom-dir "$candidate_sbom_dir" \
            --candidate-provenance "$current_provenance" \
            "${rollback_args[@]}" \
            --output "$manifest" \
            --plan-output "$plan"
          (
            cd apps/desktop
            npm run tauri -- signer sign --password "" "$manifest"
          )
          cargo build --locked --release --no-default-features --bin denoize
          while IFS=$'\t' read -r platform from_version bundle_name \
            candidate_artifact candidate_sbom candidate_provenance \
            rollback_artifact rollback_sbom rollback_provenance; do
            target/release/denoize update bundle build "$update_dir/$bundle_name" \
              --manifest "$manifest" \
              --signature "$manifest.sig" \
              --platform "$platform" \
              --from-version "$from_version" \
              --candidate-artifact "$candidate_artifact" \
              --candidate-sbom "$candidate_sbom" \
              --candidate-provenance "$candidate_provenance" \
              --rollback-artifact "$rollback_artifact" \
              --rollback-sbom "$rollback_sbom" \
              --rollback-provenance "$rollback_provenance" >/dev/null
          done < <(jq -r '.entries[] | [
            .platform,
            .from_version,
            .bundle_name,
            .candidate_artifact,
            .candidate_sbom,
            .candidate_provenance,
            .rollback_artifact,
            .rollback_sbom,
            .rollback_provenance
          ] | @tsv' "$plan")
          if [[ $(find "$update_dir" -maxdepth 1 -type f -name '*.dub' | wc -l) != 12 ]]; then
            echo "application update build did not produce exactly 12 bundles" >&2
            exit 1
          fi

          asset_list="$RUNNER_TEMP/denoize-application-update-assets.txt"
          subject_checksums="$RUNNER_TEMP/denoize-application-update-subjects.sha256"
          {
            printf '%s\n' "$manifest" "$manifest.sig"
            find "$update_dir" -maxdepth 1 -type f -name '*.dub' -print | sort
            find "$candidate_sbom_dir" -maxdepth 1 -type f -name '*.cdx.json' -print | sort
            find "$rollback_root" -mindepth 3 -maxdepth 3 -type f -path '*/sbom/*.cdx.json' -print | sort
          } > "$asset_list"
          : > "$subject_checksums"
          while IFS= read -r asset; do
            (
              cd "$(dirname "$asset")"
              sha256sum "$(basename "$asset")"
            ) >> "$subject_checksums"
          done < "$asset_list"
          {
            echo "DENOIZE_APPLICATION_UPDATE_DIR=$update_dir"
            echo "DENOIZE_APPLICATION_UPDATE_ASSETS=$asset_list"
            echo "DENOIZE_APPLICATION_UPDATE_SUBJECTS=$subject_checksums"
          } >> "$GITHUB_ENV"

      - name: Attest application update assets
        id: attest-updates
        # actions/attest v4.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: ${{ runner.temp }}/denoize-application-update-subjects.sha256

      - name: Upload application update assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          update_provenance="$DENOIZE_APPLICATION_UPDATE_DIR/denoize-update-subjects-${GITHUB_REF_NAME}.sigstore.json"
          cp "${{ steps.attest-updates.outputs.bundle-path }}" "$update_provenance"
          mapfile -t update_assets < "$DENOIZE_APPLICATION_UPDATE_ASSETS"
          gh release upload "$GITHUB_REF_NAME" \
            "${update_assets[@]}" "$update_provenance" --clobber

  publish:
    name: Publish release
    needs: publish-crate
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

  verify-assets:
    name: Verify release assets
    needs: application-update
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        # actions/checkout v6.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Verify uploaded release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/verify-release-assets.sh "$GITHUB_REF_NAME"

  publish-crate:
    name: Publish crates.io package
    needs: verify-assets
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - name: Check out tagged source
        # actions/checkout v6.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Select release Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Publish denoize to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          package="$RUNNER_TEMP/denoize-${version}.crate"
          gh release download "$GITHUB_REF_NAME" \
            --pattern "$(basename "$package")" \
            --dir "$RUNNER_TEMP"
          expected_checksum=$(sha256sum "$package" | awk '{print $1}')
          response=$(curl --fail --silent --show-error \
            --user-agent "denoize-release-workflow ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY)" \
            "https://crates.io/api/v1/crates/denoize" || true)
          if jq -e --arg version "$version" \
            '.versions[]? | select(.num == $version)' <<<"$response" >/dev/null; then
            echo "denoize $version is already published; skipping."
          else
            if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
              echo "CRATES_IO_TOKEN is not configured in the crates-io environment." >&2
              exit 1
            fi
            bash scripts/publish-crates-io.sh --expected-package "$package"
          fi
          published_checksum=""
          for attempt in $(seq 1 30); do
            response=$(curl --fail --silent --show-error \
              --user-agent "denoize-release-workflow ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY)" \
              "https://crates.io/api/v1/crates/denoize" || true)
            published_checksum=$(jq -r --arg version "$version" \
              '.versions[]? | select(.num == $version) | .checksum' <<<"$response" | head -n 1)
            if [[ -n "$published_checksum" ]]; then
              break
            fi
            sleep 2
          done
          if [[ "$published_checksum" != "$expected_checksum" ]]; then
            echo "crates.io checksum mismatch: expected $expected_checksum, got ${published_checksum:-<missing>}" >&2
            exit 1
          fi
          echo "crates.io denoize $version matches release evidence checksum $expected_checksum"
