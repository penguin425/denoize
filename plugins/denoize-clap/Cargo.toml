[package]
name = "denoize-clap"
version = "0.90.2"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false
description = "Real-time-safe CLAP plug-in for denoize"

[lib]
name = "denoize_clap"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
denoize = { path = "../..", version = "0.90.2", default-features = false, features = ["gtcrn"] }
clack-plugin = "0.1.1"
clack-extensions = { version = "0.1.1", features = [
    "audio-ports",
    "audio-ports-config",
    "clack-plugin",
    "gui",
    "latency",
    "params",
    "raw-window-handle_06",
    "state",
] }
clap-sys = "0.5.0"
crossbeam-queue = "0.3.12"
denoize-plugin-editor = { path = "../denoize-plugin-editor" }
serde_json = "1.0"

[dev-dependencies]
libc = "0.2"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[features]
default = []
# DPDFNet HQ is deliberately absent from normal release-format builds until
# the Windows/REAPER, listening, and lower-tier hardware gates are complete.
# This opt-in builds the third descriptor for direct experimental CLAP use.
experimental-dpdfnet-hq = ["denoize/dpdfnet"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
