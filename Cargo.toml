[package]
name = "denoize"
version = "0.90.2"
edition = "2021"
authors = ["denoize"]
description = "Pure-Rust audio denoiser for the world's highest sound quality. Classical DSP + optional RNNoise / DeepFilterNet backends."
license = "MIT"
readme = "README.md"
repository = "https://github.com/penguin425/denoize"
homepage = "https://github.com/penguin425/denoize"
documentation = "https://docs.rs/denoize"
rust-version = "1.96"
keywords = ["audio", "denoise", "dsp", "stft", "noise-reduction"]
categories = ["multimedia::audio", "science"]

[workspace]
resolver = "2"
members = [
    ".",
    "plugins/denoize-clap",
    "plugins/denoize-lv2",
    "plugins/denoize-plugin-editor",
    "sdk/denoize-c",
    "sdk/denoize-wasm",
]
default-members = ["."]
exclude = ["apps/desktop/src-tauri"]

[lib]
name = "denoize"
path = "src/lib.rs"

[[bin]]
name = "denoize"
path = "src/main.rs"

[[example]]
name = "dpdfnet_gtcrn_poc"
path = "examples/dpdfnet_gtcrn_poc.rs"
required-features = ["dpdfnet", "gtcrn"]

[[example]]
name = "dpdfnet_gtcrn_matrix"
path = "examples/dpdfnet_gtcrn_matrix.rs"
required-features = ["dpdfnet", "gtcrn"]

[[example]]
name = "dpdfnet_gtcrn_stress"
path = "examples/dpdfnet_gtcrn_stress.rs"
required-features = ["dpdfnet", "gtcrn"]

[[example]]
name = "dpdfnet_production_reference"
path = "examples/dpdfnet_production_reference.rs"
required-features = ["dpdfnet"]

[dependencies]
hound = "3.5"
nnnoiseless = { version = "0.5.2", optional = true, default-features = false }
# Upstream PR #695 migrates DeepFilterNet to the patched tract 0.23 line. The
# reviewed commit is mirrored under the project owner for reproducible builds.
df = { git = "https://github.com/penguin425/DeepFilterNet", rev = "9b8790dca0fbc6e3625b5d0b9aef7b90740f3563", package = "deep_filter", optional = true, default-features = false, features = ["tract", "default-model", "wav-utils", "transforms"] }
ndarray = { version = "0.17.2", optional = true }
tract-onnx = { version = "=0.23.4", optional = true }
crossbeam-queue = { version = "0.3.12", optional = true }
rustfft = { version = "6.4", optional = true }
kaldi-native-fbank = { version = "0.1.0", optional = true }
audio_samples = { version = "2.0.1", optional = true, default-features = false }
audio_samples_qoe = { version = "0.1.3", optional = true }
nanomp3 = "0.1.1"
shine-rs = "0.1.3"
oxideav-aac = "0.1.6"
oxideav-aac-encoder = { git = "https://github.com/OxideAV/oxideav-aac", rev = "e8113d5", package = "oxideav-aac", optional = true }
mp4 = "0.14.0"
rubato = "0.16.2"
sha2 = "0.10.9"
minisign-verify = "0.2.5"
base64 = "0.22.1"
ring = "0.17.14"
zeroize = "1.8.2"
fs2 = "0.4.3"
percent-encoding = "2.3.2"
ureq = { version = "2.12.1", features = ["tls", "native-certs"] }
url = "2.5.8"
claxon = "0.4.3"
flacenc = "0.5.1"
opus = "0.3.1"
ogg = "0.9.2"
symphonia = { version = "0.6.0", default-features = false, features = ["aiff", "caf", "ogg", "vorbis", "alac", "id3v2", "isomp4", "mp3", "pcm"] }
rayon = "1.11.0"
ebur128 = "0.1.10"
lofty = "0.24.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
toml = "0.8"
fdk-aac-rust = { version = "0.2.2", optional = true, default-features = false }
cpal = { version = "0.15.3", optional = true }
ctrlc = "3.4.5"
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[target.'cfg(target_os = "macos")'.dependencies]
exacl = "0.13.0"
mach2 = "0.4.3"

[target.'cfg(target_vendor = "apple")'.dependencies]
tract-metal = { version = "=0.23.4", optional = true }
metal = { version = "=0.33.0", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
tract-cuda = { version = "=0.23.4", optional = true, default-features = false, features = ["cuda-12000"] }
cudarc = { version = "=0.19.9", optional = true, default-features = false, features = ["driver", "dynamic-loading", "cuda-12000"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[features]
default = ["m4a-encode"]
rnnoise = ["dep:nnnoiseless"]
deepfilter = ["dep:df", "dep:ndarray"]
onnx = ["dep:tract-onnx", "dep:crossbeam-queue"]
aec = ["dep:rustfft"]
mpsenet = ["onnx", "dep:rustfft"]
bsrnn = ["onnx", "dep:rustfft"]
mossformer2 = ["onnx", "dep:rustfft", "dep:kaldi-native-fbank"]
sgmse = ["onnx", "dep:rustfft"]
gtcrn = ["onnx", "dep:rustfft"]
dpdfnet = ["onnx", "dep:rustfft"]
accelerators = ["onnx", "dep:tract-metal", "dep:metal", "dep:tract-cuda", "dep:cudarc"]
visqol = ["dep:audio_samples", "dep:audio_samples_qoe", "dep:ndarray"]
m4a-encode = ["dep:oxideav-aac-encoder"]
live = ["dep:cpal"]
fdk-aac-encoder = ["m4a-encode", "dep:fdk-aac-rust"]
full = ["rnnoise", "deepfilter", "onnx", "aec", "mpsenet", "bsrnn", "mossformer2", "sgmse", "gtcrn", "dpdfnet", "accelerators", "m4a-encode", "visqol", "live"]

[dev-dependencies]
minisign = "0.9.1"
prost = "0.14"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Packaged C ABI libraries use unwinding internally so every exported entry
# point can contain a panic and translate it into a stable status code. Rust
# panics are never allowed to unwind across the C boundary.
[profile.ffi-release]
inherits = "release"
panic = "unwind"

[profile.dev]
opt-level = 1

[package.metadata.docs.rs]
features = ["rnnoise", "aec", "mpsenet", "bsrnn", "mossformer2", "sgmse", "gtcrn", "dpdfnet", "visqol"]
rustdoc-args = ["--cfg", "docsrs"]
